# Rewrite environment values held inside ConfigMap and Secret data:
# endpoints, hostnames, feature flags.
#
# stringPatch replaces text inside one data key, without parsing it. Use it
# for embedded JSON, properties or URLs. Make old specific enough that it
# matches exactly one place.
#
# mergePatches replaces whole keys. Use it when you own the full value.
#
# Variables, set by transformMapping on the Restore:
#   ENV, DB_HOST
#
# Secret data is base64. The upstream sample patches Secrets with
# stringPatch, but check the decoded value after a test restore before you
# rely on it.
#
# Illustrative: not tested on a cluster.
---
apiVersion: data-protection.isf.ibm.com/v1alpha1
kind: Transform
metadata:
  name: transform-config-and-secrets
  namespace: ibm-spectrum-fusion-ns
spec:
  transforms:
    # One value inside a JSON document stored under data/app-config.json.
    - name: configmap-database-host
      stringPatch:
        - key: /data/app-config.json
          replaceStrings:
            - old: '"databaseHost": "orders-db.prod.svc"'
              new: '"databaseHost": "${DB_HOST}"'
      subject:
        groupResource: configmaps
        resourceNameRegex: ^orders-config$

    # Whole keys: safe when the restore target decides the full value.
    - name: configmap-environment-keys
      mergePatches:
        - patchData: |
            {"data": {"ENVIRONMENT": "${ENV}", "SEND_EMAIL": "false"}}
      subject:
        groupResource: configmaps
        resourceNameRegex: ^orders-config$

    # The JDBC URL inside a Secret. Anchor the regex so it matches one
    # Secret, not every Secret whose name contains the text.
    - name: secret-jdbc-url
      stringPatch:
        - key: /data/jdbc-url
          replaceStrings:
            - old: 'orders-db.prod.svc'
              new: '${DB_HOST}'
      subject:
        groupResource: secrets
        resourceNameRegex: ^orders-db-connection$
...
