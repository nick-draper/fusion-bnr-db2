<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="archTitle archDesc">
  <title id="archTitle">Db2u parent and child recipe architecture</title>
  <desc id="archDesc">Fusion PolicyAssignment names the parent recipe. The parent pauses and unpauses the instance with exec hooks in the db2u-bnr-recipe-helper pod, which patch the Db2u objects through the API, and calls the child recipe, which protects the instance namespace. No hook runs in db2-operator.</desc>
  <style>
    .bg { fill: #f4f7fb; }
    .card { fill: #ffffff; stroke: #d0d7e2; stroke-width: 1.5; }
    .title { font: 600 22px system-ui, Segoe UI, sans-serif; fill: #161616; }
    .sub { font: 400 13px system-ui, Segoe UI, sans-serif; fill: #525252; }
    .h { font: 600 14px system-ui, Segoe UI, sans-serif; fill: #161616; }
    .b { font: 400 13px system-ui, Segoe UI, sans-serif; fill: #161616; }
    .m { font: 500 12px system-ui, Segoe UI, sans-serif; fill: #525252; }
    .chip { font: 600 11px system-ui, Segoe UI, sans-serif; }
  </style>
  <rect class="bg" width="1200" height="680" rx="16"/>
  <text class="title" x="40" y="48">Parent / child recipe</text>
  <text class="sub" x="40" y="72">PolicyAssignment names only the parent. The child is discovered by label. The helper pod sets maintenance mode.</text>

  <!-- cluster -->
  <rect class="card" x="32" y="100" width="340" height="540" rx="14"/>
  <text class="h" x="52" y="132">OpenShift</text>
  <text class="m" x="52" y="152">Operator, helper, and instance stay apart</text>

  <rect x="52" y="168" width="300" height="104" rx="10" fill="#f4f4f4" stroke="#8d8d8d" stroke-width="1.5"/>
  <text class="chip" x="68" y="192" fill="#525252">NAMESPACE</text>
  <text class="h" x="68" y="214">db2-operator</text>
  <text class="b" x="68" y="238">reacts to maintenance annotations</text>
  <text class="m" x="68" y="260">No recipe hook runs here. Not backed up</text>

  <rect x="52" y="286" width="300" height="118" rx="10" fill="#edf5ff" stroke="#0f62fe" stroke-width="1.5"/>
  <text class="chip" x="68" y="310" fill="#0f62fe">NAMESPACE</text>
  <text class="h" x="68" y="332">db2u-bnr-recipe-helper</text>
  <text class="b" x="68" y="356">helper pod: curl + own service account</text>
  <text class="m" x="68" y="378">Parent helper-exec hooks run here</text>
  <text class="m" x="68" y="396">Restore maps it to itself. Not backed up</text>

  <rect x="52" y="418" width="300" height="200" rx="10" fill="#defbe6" stroke="#198038" stroke-width="1.5"/>
  <text class="chip" x="68" y="442" fill="#198038">NAMESPACE</text>
  <text class="h" x="68" y="464">db2u-instance</text>
  <text class="b" x="68" y="490">Db2uInstance  for-backup=true</text>
  <text class="b" x="68" y="512">configmaps, secrets, volumes</text>
  <text class="b" x="68" y="534">pod dashmpp-head-0 / container db2u</text>
  <text class="m" x="68" y="564">Child hooks run here (manage_snapshots, checks)</text>
  <text class="m" x="68" y="586">Application includes this namespace only</text>

  <!-- fusion -->
  <rect class="card" x="420" y="100" width="360" height="540" rx="14"/>
  <text class="h" x="440" y="132">IBM Fusion</text>
  <text class="m" x="440" y="152">ibm-spectrum-fusion-ns</text>

  <rect x="440" y="176" width="320" height="72" rx="10" fill="#f4f4f4" stroke="#8d8d8d"/>
  <text class="h" x="456" y="206">PolicyAssignment</text>
  <text class="b" x="456" y="230">recipe: db2u-instance-helper-parent</text>

  <rect x="440" y="276" width="320" height="150" rx="10" fill="#edf5ff" stroke="#0f62fe" stroke-width="1.5"/>
  <text class="chip" x="456" y="302" fill="#0f62fe">PARENT</text>
  <text class="h" x="456" y="326">db2u-instance-helper-parent</text>
  <text class="b" x="456" y="352">pause / unpause Db2uInstance</text>
  <text class="b" x="456" y="374">pause / unpause Db2uEngine</text>
  <text class="b" x="456" y="396">target display name</text>
  <text class="m" x="456" y="416">all via helper-exec</text>

  <rect x="440" y="454" width="320" height="154" rx="10" fill="#defbe6" stroke="#198038" stroke-width="1.5"/>
  <text class="chip" x="456" y="480" fill="#198038">CHILD</text>
  <text class="h" x="456" y="504">db2u-instance-helper-child</text>
  <text class="b" x="456" y="530">instance-backup</text>
  <text class="b" x="456" y="552">instance-restore</text>
  <text class="m" x="456" y="580">parent-recipe label names the parent</text>

  <!-- sequences -->
  <rect class="card" x="828" y="100" width="340" height="250" rx="14"/>
  <text class="h" x="848" y="132">Backup</text>
  <text class="b" x="848" y="168">1  Pause instance reconcile</text>
  <text class="b" x="848" y="194">2  Pause engine reconcile</text>
  <text class="b" x="848" y="220">3  Child: resources, suspend, volumes, resume</text>
  <text class="b" x="848" y="246">4  Unpause engine and instance</text>
  <text class="m" x="848" y="278">Maintenance hooks run in the helper pod</text>
  <text class="m" x="848" y="300">Namespace from the db2u-db2uinstances group</text>

  <rect class="card" x="828" y="370" width="340" height="270" rx="14"/>
  <text class="h" x="848" y="402">Restore</text>
  <text class="b" x="848" y="438">1  Set target Project display name</text>
  <text class="b" x="848" y="464">2  Child: volumes, resources, Db2uInstance</text>
  <text class="b" x="848" y="490">3  Engine Ready, snapshot restore, resume</text>
  <text class="b" x="848" y="516">4  Instance Ready</text>
  <text class="b" x="848" y="542">5  Wait 300 s</text>
  <text class="b" x="848" y="568">6  Unpause engine and instance</text>
  <text class="m" x="848" y="604">Transform runs on the restored objects</text>
  <text class="m" x="848" y="624">namespaceMapping includes the helper namespace</text>

  <!-- arrows -->
  <path d="M440 345 H352" stroke="#0f62fe" stroke-width="2" fill="none" marker-end="url(#arrBlue)"/>
  <path d="M352 520 H440" stroke="#198038" stroke-width="2" fill="none" marker-end="url(#arrGreen)"/>
  <path d="M760 350 H828" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#arrDark)"/>
  <path d="M600 248 V276" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#arrDark)"/>
  <path d="M600 426 V454" stroke="#198038" stroke-width="2" fill="none" marker-end="url(#arrGreen)"/>
  <defs>
    <marker id="arrBlue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#0f62fe"/>
    </marker>
    <marker id="arrGreen" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#198038"/>
    </marker>
    <marker id="arrDark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#161616"/>
    </marker>
  </defs>
</svg>
