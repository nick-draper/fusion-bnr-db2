---
# Operational Restore: dw-validation → dw-validation-qa.
#
# Before apply:
#   1. ./scripts/test-bnr.sh after-backup  (or oc get backup -n ibm-spectrum-fusion-ns)
#   2. Set spec.backup to that Backup object name
#   3. Ensure project dw-validation-qa exists
#
# Recipe must be the PARENT. Child is discovered by label at runtime.
apiVersion: data-protection.isf.ibm.com/v1alpha1
kind: Restore
metadata:
  name: dw-validation-restore-to-qa
  namespace: ibm-spectrum-fusion-ns
spec:
  backup: REPLACE-WITH-BACKUP-NAME

  namespaceMapping:
    dw-validation: dw-validation-qa

  recipe:
    name: db2u-parent-recipe
    namespace: ibm-spectrum-fusion-ns

  transform: dw-validation-to-qa
