---
# Example Restore: cross-namespace restore using the parent recipe + transform.
#
# Edit before apply:
#   - metadata.name
#   - spec.backup (exact Backup name from your cluster)
#   - namespaceMapping keys/values
#   - transform name if you renamed the companion Transform
#
# Point recipe at the PARENT (db2u-parent-recipe). Child recipes are discovered
# via labels during workflow execution — do not reference the child here.
apiVersion: data-protection.isf.ibm.com/v1alpha1
kind: Restore
metadata:
  name: db2u-restore-prod-to-qa-example
  namespace: ibm-spectrum-fusion-ns
spec:
  # Replace with a real Backup object name from:
  #   oc get backup -n ibm-spectrum-fusion-ns
  backup: REPLACE-WITH-BACKUP-NAME

  namespaceMapping:
    # source namespace (backed up): target namespace (must exist or be creatable)
    db2u-prod: db2u-qa

  recipe:
    name: db2u-parent-recipe
    namespace: ibm-spectrum-fusion-ns

  transform: db2u-transform-prod-to-qa
