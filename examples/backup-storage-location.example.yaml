---
# S3-compatible location used by the backup policy.
# Replace the endpoint and bucket. If the endpoint uses a private CA,
# create that cert secret separately and set privateCertificateName.
apiVersion: data-protection.isf.ibm.com/v1alpha1
kind: BackupStorageLocation
metadata:
  name: db2u-prod-backup-storage-location
  namespace: ibm-spectrum-fusion-ns
spec:
  credentialName: db2u-backup-secret
  provider: isf-backup-restore
  type: s3
  params:
    bucket: REPLACE_WITH_BUCKET_NAME
    endpoint: https://REPLACE_WITH_S3_ENDPOINT
    region: us-east-1
