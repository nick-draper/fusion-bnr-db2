---
apiVersion: data-protection.isf.ibm.com/v1alpha1
kind: BackupPolicy
metadata:
  name: db2u-prod-backup-policy
  namespace: ibm-spectrum-fusion-ns
spec:
  backupStorageLocation: db2u-prod-backup-storage-location
  # This value is required by Fusion Backup & Restore.
  provider: isf-backup-restore
  retention:
    number: 5
    unit: days
  schedule:
    cron: "00 04 * * *"
    timezone: Australia/Sydney
