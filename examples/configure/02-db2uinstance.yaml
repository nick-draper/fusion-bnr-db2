---
# Minimal Db2uInstance shape this recipe and Transform expect.
# Replace license and storage class before apply. Do not commit real license text.
apiVersion: db2u.databases.ibm.com/v1
kind: Db2uInstance
metadata:
  name: dwdb
  namespace: dw-validation
  labels:
    app.kubernetes.io/environment: validation
    for-backup: "true"
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: environment
                operator: In
                values:
                  - validation
  license:
    accept: true
    value: REPLACE_WITH_DB2_LICENSE
  nodes: 1
  version: s12.1.4.0
  environment:
    dbType: db2wh
    databases:
      - name: BLUDB
  storage:
    - name: meta
      type: create
      spec:
        storageClassName: REPLACE_WITH_STORAGE_CLASS
        accessModes:
          - ReadWriteMany
        resources:
          requests:
            storage: 5Gi
    - name: data
      type: template
      spec:
        storageClassName: REPLACE_WITH_STORAGE_CLASS
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
    - name: tempts
      type: template
      spec:
        storageClassName: REPLACE_WITH_STORAGE_CLASS
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
