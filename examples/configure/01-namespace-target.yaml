---
# Empty target project for cross-namespace restore. Create before restore;
# ns-display-name (parent recipe) overwrites openshift.io/display-name with
# "Db2 Warehouse (Restored)" at the end of the restore.
apiVersion: project.openshift.io/v1
kind: Project
metadata:
  name: dw-validation-qa
  annotations:
    openshift.io/display-name: Db2 Warehouse (QA)
    openshift.io/description: Target namespace for restoring dw-validation into QA
