---
# Required before the first backup. Names the PARENT recipe only.
# Child recipe is discovered by label. runNow stays false so configure
# does not start a backup; use the UI or operate/ for runs.
apiVersion: data-protection.isf.ibm.com/v1alpha1
kind: PolicyAssignment
metadata:
  name: dw-validation-policy-assignment
  namespace: ibm-spectrum-fusion-ns
spec:
  application: dw-validation
  backupPolicy: dw-validation-backup-policy
  runNow: false
  recipe:
    apiVersion: spp-data-protection.isf.ibm.com/v1alpha1
    kind: Recipe
    name: db2u-parent-recipe
    namespace: ibm-spectrum-fusion-ns
