# Include the instance namespace only. Do not add db2-operator.
# Recipe ${GROUP.db2u-volumes.namespace} resolves from this list.
apiVersion: application.isf.ibm.com/v1alpha1
kind: Application
metadata:
  name: dw-validation
  namespace: ibm-spectrum-fusion-ns
spec:
  enableDR: false
  includedNamespaces:
    - dw-validation
