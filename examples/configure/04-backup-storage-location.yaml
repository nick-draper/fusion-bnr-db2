---
# S3-compatible location used by the backup policy.
# Replace endpoint and bucket. Private CA: set privateCertificateName separately.
apiVersion: data-protection.isf.ibm.com/v1alpha1
kind: BackupStorageLocation
metadata:
  name: dw-validation-backup-storage-location
  namespace: ibm-spectrum-fusion-ns
spec:
  credentialName: dw-validation-backup-secret
  provider: isf-backup-restore
  type: s3
  params:
    bucket: REPLACE_WITH_BUCKET_NAME
    endpoint: https://REPLACE_WITH_S3_ENDPOINT
    region: us-east-1
