---
# Remap restored objects from dw-validation into dw-validation-qa.
# Edit JSON paths if your Db2uInstance affinity/labels differ.
# Applied at configure time; used by operate/restore-to-qa.yaml.
apiVersion: data-protection.isf.ibm.com/v1alpha1
kind: Transform
metadata:
  name: dw-validation-to-qa
  namespace: ibm-spectrum-fusion-ns
spec:
  transforms:
    - name: update-db2uinstance
      subject:
        groupResource: db2uinstances.db2u.databases.ibm.com
        resourceNameRegex: dwdb
      json:
        - op: replace
          path: /spec/affinity/nodeAffinity/requiredDuringSchedulingIgnoredDuringExecution/nodeSelectorTerms/0/matchExpressions/0/values/0
          value: qa
        - op: replace
          path: /metadata/labels/app.kubernetes.io~1environment
          value: qa
        - op: add
          path: /metadata/labels/backup
          value: restored

    - name: update-pvcs
      subject:
        groupResource: persistentvolumeclaims
        resourceNameRegex: .*
      json:
        - op: replace
          path: /metadata/labels/app.kubernetes.io~1environment
          value: qa
        - op: add
          path: /metadata/labels/backup
          value: restored
