---
apiVersion: data-protection.isf.ibm.com/v1alpha1
kind: BackupPolicy
metadata:
  name: dw-validation-backup-policy
  namespace: ibm-spectrum-fusion-ns
spec:
  backupStorageLocation: dw-validation-backup-storage-location
  provider: isf-backup-restore
  retention:
    number: 5
    unit: days
  schedule:
    cron: "00 04 * * *"
    timezone: Australia/Sydney
