---
# Child recipe: Db2u instance namespace protection (Fusion 2.10+ Dynamic Recipe)
#
# Discovered by the parent via labels. Defines instance-scoped groups, hooks,
# and the instance-backup / instance-restore-data / instance-restore-post
# workflows the parent invokes.
#
# Hook namespaces resolve from the parent's db2u-instances anchor group,
# which follows namespaceMapping on restore — do not hardcode the instance
# namespace.
#
# Comments must not contain dollar-brace text: Fusion reads it as a recipe
# variable. Exec commands use the JSON-array form that runs on the cluster;
# the multi-line shell form did not run.
#
# Label Db2uInstance objects with for-backup=true so readiness checks and the
# parent's maintenance hooks match.
apiVersion: spp-data-protection.isf.ibm.com/v1alpha1
kind: Recipe
metadata:
  name: db2u-instance-child-recipe
  namespace: ibm-spectrum-fusion-ns
  labels:
    dp.isf.ibm.com/parent-recipe: db2u-parent-recipe
    dp.isf.ibm.com/parent-recipe-namespace: ibm-spectrum-fusion-ns
spec:
  appType: db2uinstance

  # Include-lists only. IBM's sample excludes a denylist and then backs up
  # everything else in the namespace (including operator/OLM if colocated).
  # An allow-list fails closed: a new resource type is not backed up until
  # you add it after resource discovery.
  groups:
    - name: db2u-volumes
      type: volume
      disableTransform: false

    - name: db2u-resources
      type: resource
      disableTransform: false
      includedResourceTypes:
        - configmaps
        - secrets

    - name: db2u-db2uinstances
      type: resource
      disableTransform: false
      includedResourceTypes:
        - db2uinstances.db2u.databases.ibm.com

  hooks:
    - name: db2uengine-check
      type: check
      namespace: '${GROUP.db2u-instances.namespace}'
      selectResource: db2u.databases.ibm.com/v1alpha1/db2uengines
      labelSelector: 'type=engine,component=db2wh,formation_type=db2wh'
      onError: fail
      timeout: 120
      chks:
        - name: stateReady
          condition: '{$.status.state} == {"Ready"}'
          onError: fail
          timeout: 600

    - name: db2uinstance-check
      type: check
      namespace: '${GROUP.db2u-instances.namespace}'
      selectResource: db2u.databases.ibm.com/v1/db2uinstances
      labelSelector: for-backup=true
      onError: fail
      timeout: 800
      chks:
        # Settle check after the parent unpauses the operator. Replaces the
        # old fixed 300 s sleep: waits only as long as the operator needs to
        # finish reconciling the formation before the engine check and the Db2
        # snapshot restore. If FormationStatus only turns OK after
        # manage_snapshots restore on your version, pick a condition that flips
        # first after unpause.
        - name: settled
          condition: '{$.status.conditions[?(@.type=="FormationStatus")].status} == {"OK"}'
          onError: fail
          timeout: 600

        # Advanced check (Fusion 2.9+ logical expressions): Ready is not enough
        # if the formation condition is not OK. Drop the FormationStatus clause
        # (and the settled check) if your Db2uInstance status does not publish
        # that condition.
        - name: stateReady
          condition: '(({$.status.state} == {"Ready"}) && ({$.status.conditions[?(@.type=="FormationStatus")].status} == {"OK"}))'
          onError: fail
          timeout: 900

    - name: mark-instance-restored
      type: annotation
      namespace: '${GROUP.db2u-instances.namespace}'
      selectResource: db2u.databases.ibm.com/v1/db2uinstances
      labelSelector: for-backup=true
      onError: fail
      timeout: 60
      ops:
        # Visible marker that this instance came from a Fusion restore.
        # Annotation (not a selector label) so for-backup=true is unchanged.
        - name: set-restored
          annotations: db2u.fusion/restored=true
          overwrite: true
          onError: fail
          timeout: 60

    - name: db2uinstances-pod-exec
      type: exec
      namespace: '${GROUP.db2u-instances.namespace}'
      selectResource: pod
      labelSelector: name=dashmpp-head-0
      onError: fail
      timeout: 300
      ops:
        # Quiesce before volume snapshot; resume automatically if snapshot fails
        - name: suspend
          container: db2u
          overwrite: false
          onError: fail
          inverseOp: resume
          timeout: 300
          command: |
            ["/bin/bash", "-c", "manage_snapshots --action suspend --retry 3"]

        - name: resume
          container: db2u
          overwrite: false
          onError: fail
          timeout: 300
          command: |
            ["/bin/bash", "-c", "manage_snapshots --action resume --retry 3"]

        - name: restore
          container: db2u
          overwrite: false
          onError: fail
          timeout: 300
          command: |
            ["/bin/bash", "-c", "manage_snapshots --action restore --retry 3"]

  workflows:
    # Invoked from parent backup after maintenance is enabled
    - name: instance-backup
      failOn: any-error
      priority: 1000
      sequence:
        - group: db2u-resources
        - group: db2u-db2uinstances
        - hook: db2uinstances-pod-exec/suspend
        - group: db2u-volumes
        - hook: db2uinstances-pod-exec/resume

    # Invoked from parent restore first; the parent then clears maintenance
    - name: instance-restore-data
      failOn: any-error
      priority: 1000
      sequence:
        - group: db2u-volumes
        - group: db2u-resources
        - group: db2u-db2uinstances

    # Invoked from parent restore after maintenance is cleared
    - name: instance-restore-post
      failOn: any-error
      priority: 1000
      sequence:
        - hook: db2uinstance-check/settled
        - hook: db2uengine-check/stateReady
        - hook: db2uinstances-pod-exec/restore
        - hook: db2uinstances-pod-exec/resume
        - hook: db2uinstance-check/stateReady
        - hook: mark-instance-restored/set-restored
