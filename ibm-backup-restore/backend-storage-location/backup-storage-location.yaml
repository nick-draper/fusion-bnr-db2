---
apiVersion: data-protection.isf.ibm.com/v1alpha1
kind: BackupStorageLocation
metadata:
  name: db2u-instance-backup-storage-location
  namespace: ${FUSION_NS}
spec:
  credentialName: db2u-instance-backup-secret
  params:
    bucket: ${S3_BUCKET_NAME}
    endpoint: '${S3_ENDPOINT}'
    region: ${S3_REGION}
  privateCertificateName: minio-registry-cert-secret
  provider: isf-backup-restore
  type: s3
...
