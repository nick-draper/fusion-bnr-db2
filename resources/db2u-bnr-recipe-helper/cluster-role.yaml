---
# Permissions for the db2u-bnr-recipe-helper service account. The parent
# recipe's helper-exec hooks run curl in the helper pod with this account's
# token, in any Db2 namespace:
#   - list Db2uInstances / Db2uEngines, then patch maintenance-pause-reconcile
#   - set the target Project display name (patch namespaces)
#
# pods/exec cluster-wide is powerful. To narrow it, bind this ClusterRole
# with a RoleBinding in each Db2 namespace (and in each restore target, from
# its Project manifest) instead of the ClusterRoleBinding.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: db2u-bnr-recipe-helper

rules:
  - apiGroups:
      - db2u.databases.ibm.com
    resources:
      - db2uinstances
      - db2uengines
    verbs:
      - get
      - list
      - watch
      - patch
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - pods/exec
    verbs:
      - create
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - patch
...
