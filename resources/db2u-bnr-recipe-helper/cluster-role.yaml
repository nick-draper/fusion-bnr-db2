---
# What the hook commands do, in any Db2 namespace:
#   - pause/unpause reconcile and mark restored (annotate instances/engines)
#   - wait for Ready (read instances/engines)
#   - manage_snapshots in dashmpp-head-0 (pods/exec)
#   - set the target Project display name (patch namespaces)
#
# pods/exec cluster-wide is powerful. To narrow it, bind this ClusterRole # with a RoleBinding in each Db2 namespace (and in each restore target, from # its Project manifest) instead of the ClusterRoleBinding below.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: db2u-bnr-recipe-helper
rules:
  - apiGroups: [db2u.databases.ibm.com]
    resources: [db2uinstances, db2uengines]
    verbs: [get, list, watch, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, patch]
...
