<svg xmlns="http://www.w3.org/2000/svg" id="db2u-transform" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-labelledby="db2u-transform-t db2u-transform-d"><title id="db2u-transform-t">Cross-namespace restore</title><desc id="db2u-transform-d">Cross-namespace restore: namespaceMapping moves objects from db2u-instance to db2u-instance-dev, the Transform rewrites affinity and environment labels from prod to dev and adds backup=restored on the instance and PVCs, and helper-exec sets the Project display name. The helper namespace maps to itself.</desc><style>#db2u-transform{--sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;--mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;--bg:#F4F4F4;--panel:#FFFFFF;--line:#E0E0E0;--ink:#161616;--muted:#525252;--faint:#8D8D8D;--grid:#E8E8E8;--priF:#EDF5FF;--priL:#0F62FE;--priI:#0043CE;--secF:#D9FBFB;--secL:#007D79;--secI:#005D5D;--neuF:#F4F4F4;--neuL:#A8A8A8;--neuI:#525252;--cauF:#FCF4D6;--cauL:#B28600;--cauI:#684E00;--danF:#FFF1F1;--danL:#A2191F;--danI:#750E13}@media (prefers-color-scheme: dark){#db2u-transform{--bg:#161616;--panel:#262626;--line:#393939;--ink:#F4F4F4;--muted:#C6C6C6;--faint:#8D8D8D;--grid:#1F1F1F;--priF:#001141;--priL:#78A9FF;--priI:#A6C8FF;--secF:#081A1C;--secL:#08BDBA;--secI:#3DDBD9;--neuF:#262626;--neuL:#6F6F6F;--neuI:#C6C6C6;--cauF:#1C1500;--cauL:#D2A106;--cauI:#FDDC69;--danF:#2D0709;--danL:#FA4D56;--danI:#FFB3B8}}#db2u-transform text{font-family:var(--sans)}#db2u-transform .ttl{font-size:20px;font-weight:600;fill:var(--ink);letter-spacing:-0.01em}#db2u-transform .sub{font-size:13px;fill:var(--muted)}#db2u-transform .fig{font-family:var(--mono);font-size:11px;font-weight:500;fill:var(--faint);letter-spacing:0.08em}#db2u-transform .eye{font-size:10.5px;font-weight:600;letter-spacing:0.06em;font-family:var(--mono)}#db2u-transform .h{font-size:14px;font-weight:600;fill:var(--ink)}#db2u-transform .hm{font-family:var(--mono);font-size:13px;font-weight:600;fill:var(--ink)}#db2u-transform .gh{font-size:13px;font-weight:600;fill:var(--ink)}#db2u-transform .b{font-size:12.5px;fill:var(--ink)}#db2u-transform .m{font-family:var(--mono);font-size:11px;fill:var(--muted)}#db2u-transform .mv{font-family:var(--mono);font-size:12px;font-weight:500;fill:var(--ink)}#db2u-transform .lab{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}#db2u-transform .labd{font-family:var(--mono);font-size:10.5px;font-weight:500;fill:var(--danI)}#db2u-transform .hd{font-family:var(--mono);font-size:10.5px;font-weight:500;fill:var(--faint);letter-spacing:0.08em}</style><defs><marker id="db2u-transform-m-neu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-transform-m-pri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:var(--priL)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-transform-m-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:var(--secL)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-transform-m-cau" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:var(--cauL)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-transform-m-dan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" f