<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="foTitle foDesc">
  <title id="foTitle">Failure undo during backup</title>
  <desc id="foDesc">If the volume snapshot fails after suspend or maintenance mode, inverseOp resumes database I/O and clears maintenance so the instance is not left locked.</desc>
  <style>
    .bg { fill: #f4f7fb; }
    .card { fill: #ffffff; stroke: #d0d7e2; stroke-width: 1.5; }
    .title { font: 600 22px system-ui, Segoe UI, sans-serif; fill: #161616; }
    .sub { font: 400 13px system-ui, Segoe UI, sans-serif; fill: #525252; }
    .h { font: 600 14px system-ui, Segoe UI, sans-serif; fill: #161616; }
    .b { font: 400 13px system-ui, Segoe UI, sans-serif; fill: #161616; }
    .m { font: 500 12px system-ui, Segoe UI, sans-serif; fill: #525252; }
    .chip { font: 600 11px system-ui, Segoe UI, sans-serif; }
  </style>
  <rect class="bg" width="1200" height="640" rx="16"/>
  <text class="title" x="40" y="48">Failure undo</text>
  <text class="sub" x="40" y="72">inverseOp runs the paired step if a later backup step fails. The database must not stay quiesced.</text>

  <!-- happy path -->
  <rect x="40" y="110" width="200" height="88" rx="12" fill="#edf5ff" stroke="#0f62fe" stroke-width="1.5"/>
  <text class="chip" x="56" y="138" fill="#0f62fe">ON</text>
  <text class="h" x="56" y="164">maintenance-mode-on</text>
  <text class="m" x="56" y="184">inverseOp: maintenance-off</text>

  <rect x="300" y="110" width="200" height="88" rx="12" fill="#edf5ff" stroke="#0f62fe" stroke-width="1.5"/>
  <text class="chip" x="316" y="138" fill="#0f62fe">ON</text>
  <text class="h" x="316" y="164">engine-maintenance-on</text>
  <text class="m" x="316" y="184">inverseOp: engine-off</text>

  <rect x="560" y="110" width="180" height="88" rx="12" fill="#fff8e1" stroke="#f1c21b" stroke-width="1.5"/>
  <text class="chip" x="576" y="138" fill="#8a6a00">QUIESCE</text>
  <text class="h" x="576" y="164">suspend</text>
  <text class="m" x="576" y="184">inverseOp: resume</text>

  <rect x="800" y="110" width="180" height="88" rx="12" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
  <text class="chip" x="816" y="138" fill="#161616">SNAPSHOT</text>
  <text class="h" x="816" y="164">db2u-volumes</text>
  <text class="m" x="816" y="184">can fail here</text>

  <rect x="1040" y="110" width="120" height="88" rx="12" fill="#defbe6" stroke="#198038" stroke-width="1.5"/>
  <text class="chip" x="1056" y="146" fill="#198038">OK</text>
  <text class="h" x="1056" y="172">resume</text>

  <path d="M240 154 H300" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#d)"/>
  <path d="M500 154 H560" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#d)"/>
  <path d="M740 154 H800" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#d)"/>
  <path d="M980 154 H1040" stroke="#198038" stroke-width="2" fill="none" marker-end="url(#g)"/>

  <!-- failure branch -->
  <path d="M890 198 V292" stroke="#da1e28" stroke-width="2" fill="none" marker-end="url(#r)"/>

  <text class="chip" x="560" y="240" fill="#da1e28">SNAPSHOT FAILS. UNDO RUNS IN REVERSE.</text>

  <rect x="40" y="300" width="340" height="120" rx="12" fill="#fff1f1" stroke="#da1e28" stroke-width="1.5"/>
  <text class="h" x="60" y="334">1  resume</text>
  <text class="b" x="60" y="362">manage_snapshots --action resume</text>
  <text class="m" x="60" y="390">Writes are allowed again on dashmpp-head-0</text>

  <rect x="420" y="300" width="360" height="120" rx="12" fill="#fff1f1" stroke="#da1e28" stroke-width="1.5"/>
  <text class="h" x="440" y="334">2  engine-maintenance-off</text>
  <text class="b" x="440" y="362">clear maintenance-pause-reconcile</text>
  <text class="m" x="440" y="390">Db2uEngine reconcile continues</text>

  <rect x="820" y="300" width="340" height="120" rx="12" fill="#fff1f1" stroke="#da1e28" stroke-width="1.5"/>
  <text class="h" x="840" y="334">3  maintenance-mode-off</text>
  <text class="b" x="840" y="362">clear the instance annotation</text>
  <text class="m" x="840" y="390">Operator manager pod runs the patch</text>

  <rect class="card" x="40" y="460" width="1120" height="140" rx="14"/>
  <text class="h" x="60" y="496">What this undo is, and what it is not</text>
  <text class="b" x="60" y="528">It returns the live database to service after a failed backup. It does not fail the cluster over to another site.</text>
  <text class="b" x="60" y="554">A separate Restore into a new namespace is the recovery path. Watch Restore timeouts: a timed-out job has deleted the target namespace in practice.</text>
  <defs>
    <marker id="d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#161616"/></marker>
    <marker id="g" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#198038"/></marker>
    <marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#da1e28"/></marker>
  </defs>
</svg>
