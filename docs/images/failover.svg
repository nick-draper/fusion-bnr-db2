<svg xmlns="http://www.w3.org/2000/svg" id="db2u-failover" viewBox="0 0 1200 452" width="1200" height="452" role="img" aria-labelledby="db2u-failover-t db2u-failover-d"><title id="db2u-failover-t">Backup failure undo</title><desc id="db2u-failover-d">Backup failure undo: the backup pauses the instance, pauses the engine, suspends writes and snapshots the volumes. A failure at any of the later steps runs the inverseOp of every step already completed, newest first: resume writes, unpause the engine, unpause the instance.</desc><style>#db2u-failover{--sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;--mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;--bg:#F4F4F4;--panel:#FFFFFF;--line:#E0E0E0;--ink:#161616;--muted:#525252;--faint:#8D8D8D;--grid:#E8E8E8;--priF:#EDF5FF;--priL:#0F62FE;--priI:#0043CE;--secF:#D9FBFB;--secL:#007D79;--secI:#005D5D;--neuF:#F4F4F4;--neuL:#A8A8A8;--neuI:#525252;--cauF:#FCF4D6;--cauL:#B28600;--cauI:#684E00;--danF:#FFF1F1;--danL:#A2191F;--danI:#750E13}@media (prefers-color-scheme: dark){#db2u-failover{--bg:#161616;--panel:#262626;--line:#393939;--ink:#F4F4F4;--muted:#C6C6C6;--faint:#8D8D8D;--grid:#1F1F1F;--priF:#001141;--priL:#78A9FF;--priI:#A6C8FF;--secF:#081A1C;--secL:#08BDBA;--secI:#3DDBD9;--neuF:#262626;--neuL:#6F6F6F;--neuI:#C6C6C6;--cauF:#1C1500;--cauL:#D2A106;--cauI:#FDDC69;--danF:#2D0709;--danL:#FA4D56;--danI:#FFB3B8}}#db2u-failover text{font-family:var(--sans)}#db2u-failover .ttl{font-size:20px;font-weight:600;fill:var(--ink);letter-spacing:-0.01em}#db2u-failover .sub{font-size:13px;fill:var(--muted)}#db2u-failover .fig{font-family:var(--mono);font-size:11px;font-weight:500;fill:var(--faint);letter-spacing:0.08em}#db2u-failover .eye{font-size:10.5px;font-weight:600;letter-spacing:0.06em;font-family:var(--mono)}#db2u-failover .h{font-size:14px;font-weight:600;fill:var(--ink)}#db2u-failover .hm{font-family:var(--mono);font-size:13px;font-weight:600;fill:var(--ink)}#db2u-failover .gh{font-size:13px;font-weight:600;fill:var(--ink)}#db2u-failover .b{font-size:12.5px;fill:var(--ink)}#db2u-failover .m{font-family:var(--mono);font-size:11px;fill:var(--muted)}#db2u-failover .mv{font-family:var(--mono);font-size:12px;font-weight:500;fill:var(--ink)}#db2u-failover .lab{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}#db2u-failover .labd{font-family:var(--mono);font-size:10.5px;font-weight:500;fill:var(--danI)}#db2u-failover .hd{font-family:var(--mono);font-size:10.5px;font-weight:500;fill:var(--faint);letter-spacing:0.08em}</style><defs><marker id="db2u-failover-m-neu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-failover-m-pri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:var(--priL)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-failover-m-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:var(--secL)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-failover-m-cau" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:var(--cauL)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-failover-m-dan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:var(--danL)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><pattern id="db2u-failover-pat" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" style="fill:var(--grid)"/></pattern></defs><rect width="1200" height="452" rx="10" style="fill:var(--bg)"/><rect width="1200" height="452" rx="10" fill="url(#db2u-failover-pat)"/><text x="40" y="52" class="ttl">Backup failure undo</text><text x="40" y="76" class="sub">Each quiesce step names an inverseOp. A failure at any later step runs the completed steps' inverseOps, newest first.</text><text x="1160" y="52" class="fig" text-anchor="end">FIG 5</text><g><rect x="40" y="112" width="212" height="104" rx="4" style="fill:var(--panel);stroke:var(--priL)" stroke-width="1"/><rect x="56" y="127" width="7" height="7" style="fill:var(--priL)"/><text x="70" y="134" class="eye" style="fill:var(--priI)">1 · PAUSE</text><text x="56" y="158" class="h">Db2uInstance</text><text x="56" y="180" class="m">maintenance-mode-on</text></g><path d="M254 154H266" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-m-neu)"/><g><rect x="268" y="112" width="212" height="104" rx="4" style="fill:var(--panel);stroke:var(--priL)" stroke-width="1"/><rect x="284" y="127" width="7" height="7" style="fill:var(--priL)"/><text x="298" y="134" class="eye" style="fill:var(--priI)">2 · PAUSE</text><text x="284" y="158" class="h">Db2uEngine</text><text x="284" y="180" class="m">engine-maintenance-mode-on</text></g><path d="M482 154H494" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-m-neu)"/><g><rect x="496" y="112" width="212" height="104" rx="4" style="fill:var(--panel);stroke:var(--cauL)" stroke-width="1"/><rect x="512" y="127" width="7" height="7" style="fill:var(--cauL)"/><text x="526" y="134" class="eye" style="fill:var(--cauI)">3 · QUIESCE</text><text x="512" y="158" class="h">suspend</text><text x="512" y="180" class="m">manage_snapshots</text></g><path d="M710 154H722" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-m-neu)"/><g><rect x="724" y="112" width="212" height="104" rx="4" style="fill:var(--panel);stroke:var(--neuL)" stroke-width="1"/><rect x="740" y="127" width="7" height="7" style="fill:var(--neuL)"/><text x="754" y="134" class="eye" style="fill:var(--neuI)">4 · SNAPSHOT</text><text x="740" y="158" class="h">db2u-volumes</text><text x="740" y="180" class="m">volume group</text></g><path d="M938 154H950" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-m-neu)"/><g><rect x="952" y="112" width="212" height="104" rx="4" style="fill:var(--panel);stroke:var(--secL)" stroke-width="1"/><rect x="968" y="127" width="7" height="7" style="fill:var(--secL)"/><text x="982" y="134" class="eye" style="fill:var(--secI)">5 · RESUME</text><text x="968" y="158" class="h">resume</text><text x="968" y="180" class="m">normal path</text></g><g><rect x="268" y="300" width="212" height="116" rx="4" style="fill:var(--panel);stroke:var(--danL)" stroke-width="1"/><rect x="284" y="315" width="7" height="7" style="fill:var(--danL)"/><text x="298" y="322" class="eye" style="fill:var(--danI)">UNDO · INVERSEOP</text><text x="284" y="346" class="h">Unpause instance</text><text x="284" y="368" class="m">maintenance-mode-off</text><text x="284" y="387" class="b">Reverses step 1</text></g><path d="M374 218V297" fill="none" style="stroke:var(--danL)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-m-dan)"/><rect x="352.0" y="250" width="44.0" height="17" rx="3" style="fill:var(--bg)"/><text x="374" y="262" class="labd" text-anchor="middle">fails</text><g><rect x="496" y="300" width="212" height="116" rx="4" style="fill:var(--panel);stroke:var(--danL)" stroke-width="1"/><rect x="512" y="315" width="7" height="7" style="fill:var(--danL)"/><text x="526" y="322" class="eye" style="fill:var(--danI)">UNDO · INVERSEOP</text><text x="512" y="346" class="h">Unpause engine</text><text x="512" y="368" class="m">engine-maintenance-mode-off</text><text x="512" y="387" class="b">Reverses step 2</text></g><path d="M602 218V297" fill="none" style="stroke:var(--danL)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-m-dan)"/><rect x="580.0" y="250" width="44.0" height="17" rx="3" style="fill:var(--bg)"/><text x="602" y="262" class="labd" text-anchor="middle">fails</text><g><rect x="724" y="300" width="212" height="116" rx="4" style="fill:var(--panel);stroke:var(--danL)" stroke-width="1"/><rect x="740" y="315" width="7" height="7" style="fill:var(--danL)"/><text x="754" y="322" class="eye" style="fill:var(--danI)">UNDO · INVERSEOP</text><text x="740" y="346" class="h">Resume writes</text><text x="740" y="368" class="m">manage_snapshots resume</text><text x="740" y="387" class="b">Reverses step 3</text></g><path d="M830 218V297" fill="none" style="stroke:var(--danL)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-m-dan)"/><rect x="808.0" y="250" width="44.0" height="17" rx="3" style="fill:var(--bg)"/><text x="830" y="262" class="labd" text-anchor="middle">fails</text><g><rect x="40" y="300" width="212" height="116" rx="4" style="fill:var(--panel);stroke:var(--secL)" stroke-width="1"/><rect x="56" y="315" width="7" height="7" style="fill:var(--secL)"/><text x="70" y="322" class="eye" style="fill:var(--secI)">RESULT</text><text x="56" y="346" class="h">Source in service</text><text x="56" y="368" class="m">writable, reconciling</text><text x="56" y="387" class="b">Not a failover</text></g><path d="M722 346H710" fill="none" style="stroke:var(--danL)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-m-dan)"/><path d="M494 346H482" fill="none" style="stroke:var(--danL)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-m-dan)"/><path d="M266 346H254" fill="none" style="stroke:var(--danL)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-m-dan)"/></svg>
