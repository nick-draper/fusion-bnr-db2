<svg xmlns="http://www.w3.org/2000/svg" id="db2u-failover-light" viewBox="0 0 1200 452" width="1200" height="452" role="img" aria-labelledby="db2u-failover-light-t db2u-failover-light-d"><title id="db2u-failover-light-t">Backup failure undo</title><desc id="db2u-failover-light-d">Backup failure undo: the backup pauses the instance, pauses the engine, suspends writes and snapshots the volumes. A failure at any of the later steps runs the inverseOp of every step already completed, newest first: resume writes, unpause the engine, unpause the instance.</desc><style>#db2u-failover-light text{font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}#db2u-failover-light .ttl{font-size:20px;font-weight:600;fill:#161616;letter-spacing:-0.01em}#db2u-failover-light .sub{font-size:13px;fill:#525252}#db2u-failover-light .fig{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;font-weight:500;fill:#8D8D8D;letter-spacing:0.08em}#db2u-failover-light .eye{font-size:10.5px;font-weight:600;letter-spacing:0.06em;font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}#db2u-failover-light .h{font-size:14px;font-weight:600;fill:#161616}#db2u-failover-light .hm{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:13px;font-weight:600;fill:#161616}#db2u-failover-light .gh{font-size:13px;font-weight:600;fill:#161616}#db2u-failover-light .b{font-size:12.5px;fill:#161616}#db2u-failover-light .m{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;fill:#525252}#db2u-failover-light .mv{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:500;fill:#161616}#db2u-failover-light .lab{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10.5px;fill:#525252}#db2u-failover-light .labd{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10.5px;font-weight:500;fill:#750E13}#db2u-failover-light .hd{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10.5px;font-weight:500;fill:#8D8D8D;letter-spacing:0.08em}</style><defs><marker id="db2u-failover-light-m-neu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#525252" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-failover-light-m-pri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#0F62FE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-failover-light-m-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#007D79" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-failover-light-m-cau" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#B28600" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-failover-light-m-dan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#A2191F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><pattern id="db2u-failover-light-pat" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" style="fill:#E8E8E8"/></pattern></defs><rect width="1200" height="452" rx="10" style="fill:#FFFFFF"/><rect width="1200" height="452" rx="10" fill="url(#db2u-failover-light-pat)"/><text x="40" y="52" class="ttl">Backup failure undo</text><text x="40" y="76" class="sub">Each quiesce step names an inverseOp. A failure at any later step runs the completed steps' inverseOps, newest first.</text><text x="1160" y="52" class="fig" text-anchor="end">FIG 6</text><g><rect x="40" y="112" width="212" height="104" rx="4" style="fill:#FFFFFF;stroke:#0F62FE" stroke-width="1"/><rect x="56" y="127" width="7" height="7" style="fill:#0F62FE"/><text x="70" y="134" class="eye" style="fill:#0043CE">1 · PAUSE</text><text x="56" y="158" class="h">Db2uInstance</text><text x="56" y="180" class="m">maintenance-mode-on</text></g><path d="M254 154H266" fill="none" style="stroke:#525252" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-light-m-neu)"/><g><rect x="268" y="112" width="212" height="104" rx="4" style="fill:#FFFFFF;stroke:#0F62FE" stroke-width="1"/><rect x="284" y="127" width="7" height="7" style="fill:#0F62FE"/><text x="298" y="134" class="eye" style="fill:#0043CE">2 · PAUSE</text><text x="284" y="158" class="h">Db2uEngine</text><text x="284" y="180" class="m">engine-maintenance-mode-on</text></g><path d="M482 154H494" fill="none" style="stroke:#525252" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-light-m-neu)"/><g><rect x="496" y="112" width="212" height="104" rx="4" style="fill:#FFFFFF;stroke:#B28600" stroke-width="1"/><rect x="512" y="127" width="7" height="7" style="fill:#B28600"/><text x="526" y="134" class="eye" style="fill:#684E00">3 · QUIESCE</text><text x="512" y="158" class="h">suspend</text><text x="512" y="180" class="m">manage_snapshots</text></g><path d="M710 154H722" fill="none" style="stroke:#525252" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-light-m-neu)"/><g><rect x="724" y="112" width="212" height="104" rx="4" style="fill:#FFFFFF;stroke:#A8A8A8" stroke-width="1"/><rect x="740" y="127" width="7" height="7" style="fill:#A8A8A8"/><text x="754" y="134" class="eye" style="fill:#525252">4 · SNAPSHOT</text><text x="740" y="158" class="h">db2u-volumes</text><text x="740" y="180" class="m">volume group</text></g><path d="M938 154H950" fill="none" style="stroke:#525252" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-light-m-neu)"/><g><rect x="952" y="112" width="212" height="104" rx="4" style="fill:#FFFFFF;stroke:#007D79" stroke-width="1"/><rect x="968" y="127" width="7" height="7" style="fill:#007D79"/><text x="982" y="134" class="eye" style="fill:#005D5D">5 · RESUME</text><text x="968" y="158" class="h">resume</text><text x="968" y="180" class="m">normal path</text></g><g><rect x="268" y="300" width="212" height="116" rx="4" style="fill:#FFFFFF;stroke:#A2191F" stroke-width="1"/><rect x="284" y="315" width="7" height="7" style="fill:#A2191F"/><text x="298" y="322" class="eye" style="fill:#750E13">UNDO · INVERSEOP</text><text x="284" y="346" class="h">Unpause instance</text><text x="284" y="368" class="m">maintenance-mode-off</text><text x="284" y="387" class="b">Reverses step 1</text></g><path d="M374 218V297" fill="none" style="stroke:#A2191F" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-light-m-dan)"/><rect x="352.3" y="250" width="43.5" height="17" rx="3" style="fill:#FFFFFF"/><text x="374" y="262" class="labd" text-anchor="middle">fails</text><g><rect x="496" y="300" width="212" height="116" rx="4" style="fill:#FFFFFF;stroke:#A2191F" stroke-width="1"/><rect x="512" y="315" width="7" height="7" style="fill:#A2191F"/><text x="526" y="322" class="eye" style="fill:#750E13">UNDO · INVERSEOP</text><text x="512" y="346" class="h">Unpause engine</text><text x="512" y="368" class="m">engine-maintenance-mode-off</text><text x="512" y="387" class="b">Reverses step 2</text></g><path d="M602 218V297" fill="none" style="stroke:#A2191F" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-light-m-dan)"/><rect x="580.3" y="250" width="43.5" height="17" rx="3" style="fill:#FFFFFF"/><text x="602" y="262" class="labd" text-anchor="middle">fails</text><g><rect x="724" y="300" width="212" height="116" rx="4" style="fill:#FFFFFF;stroke:#A2191F" stroke-width="1"/><rect x="740" y="315" width="7" height="7" style="fill:#A2191F"/><text x="754" y="322" class="eye" style="fill:#750E13">UNDO · INVERSEOP</text><text x="740" y="346" class="h">Resume writes</text><text x="740" y="368" class="m">manage_snapshots resume</text><text x="740" y="387" class="b">Reverses step 3</text></g><path d="M830 218V297" fill="none" style="stroke:#A2191F" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-light-m-dan)"/><rect x="808.3" y="250" width="43.5" height="17" rx="3" style="fill:#FFFFFF"/><text x="830" y="262" class="labd" text-anchor="middle">fails</text><g><rect x="40" y="300" width="212" height="116" rx="4" style="fill:#FFFFFF;stroke:#007D79" stroke-width="1"/><rect x="56" y="315" width="7" height="7" style="fill:#007D79"/><text x="70" y="322" class="eye" style="fill:#005D5D">RESULT</text><text x="56" y="346" class="h">Source in service</text><text x="56" y="368" class="m">writable, reconciling</text><text x="56" y="387" class="b">Operational</text></g><path d="M722 346H710" fill="none" style="stroke:#A2191F" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-light-m-dan)"/><path d="M494 346H482" fill="none" style="stroke:#A2191F" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-light-m-dan)"/><path d="M266 346H254" fill="none" style="stroke:#A2191F" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-light-m-dan)"/></svg>
