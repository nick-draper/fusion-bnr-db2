<svg xmlns="http://www.w3.org/2000/svg" id="db2u-architecture-dark" viewBox="0 0 1200 656" width="1200" height="656" role="img" aria-labelledby="db2u-architecture-dark-t db2u-architecture-dark-d"><title id="db2u-architecture-dark-t">Recipe workflow</title><desc id="db2u-architecture-dark-d">Recipe topology: the policy assignment names the application and the parent recipe. The parent finds the child by label. The parent runs helper-exec in the helper pod, which patches the Db2uInstance and Db2uEngine. The child runs manage_snapshots in dashmpp-head-0. The operator reconciles but runs no hooks. Only db2u-instance is backed up.</desc><style>#db2u-architecture-dark text{font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}#db2u-architecture-dark .ttl{font-size:20px;font-weight:600;fill:#F4F4F4;letter-spacing:-0.01em}#db2u-architecture-dark .sub{font-size:13px;fill:#C6C6C6}#db2u-architecture-dark .fig{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;font-weight:500;fill:#8D8D8D;letter-spacing:0.08em}#db2u-architecture-dark .eye{font-size:10.5px;font-weight:600;letter-spacing:0.06em;font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}#db2u-architecture-dark .h{font-size:14px;font-weight:600;fill:#F4F4F4}#db2u-architecture-dark .hm{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:13px;font-weight:600;fill:#F4F4F4}#db2u-architecture-dark .gh{font-size:13px;font-weight:600;fill:#F4F4F4}#db2u-architecture-dark .b{font-size:12.5px;fill:#F4F4F4}#db2u-architecture-dark .m{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;fill:#C6C6C6}#db2u-architecture-dark .mv{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:500;fill:#F4F4F4}#db2u-architecture-dark .lab{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10.5px;fill:#C6C6C6}#db2u-architecture-dark .labd{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10.5px;font-weight:500;fill:#FFB3B8}#db2u-architecture-dark .hd{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10.5px;font-weight:500;fill:#8D8D8D;letter-spacing:0.08em}</style><defs><marker id="db2u-architecture-dark-m-neu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#C6C6C6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-architecture-dark-m-pri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#78A9FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-architecture-dark-m-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#08BDBA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-architecture-dark-m-cau" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#D2A106" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-architecture-dark-m-dan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#FA4D56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><pattern id="db2u-architecture-dark-pat" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" style="fill:#1F1F1F"/></pattern></defs><rect width="1200" height="656" rx="10" style="fill:#161616"/><rect width="1200" height="656" rx="10" fill="url(#db2u-architecture-dark-pat)"/><text x="40" y="52" class="ttl">Recipe workflow</text><text x="40" y="76" class="sub">The parent pauses the instance from the helper pod. The child manages resources and snapshots. Nothing runs in db2-operator.</text><text x="1160" y="52" class="fig" text-anchor="end">FIG 3</text><rect x="40" y="104" width="360" height="512" rx="8" style="fill:none;stroke:#8D8D8D" stroke-width="1" stroke-dasharray="5 4"/><text x="60" y="134" class="gh">IBM Fusion</text><text x="380" y="134" class="m" text-anchor="end">ibm-spectrum-fusion-ns</text><rect x="500" y="104" width="660" height="512" rx="8" style="fill:none;stroke:#8D8D8D" stroke-width="1" stroke-dasharray="5 4"/><text x="520" y="134" class="gh">OpenShift cluster</text><text x="1140" y="134" class="m" text-anchor="end">workload namespaces</text><g><rect x="72" y="152" width="296" height="100" rx="4" style="fill:#262626;stroke:#6F6F6F" stroke-width="1"/><rect x="88" y="167" width="7" height="7" style="fill:#6F6F6F"/><text x="102" y="174" class="eye" style="fill:#C6C6C6">ASSIGNMENT</text><text x="88" y="198" class="h">Policy assignment</text><text x="88" y="220" class="m">application: db2u-instance</text><text x="88" y="239" class="m">recipe: db2u-instance-helper-parent</text></g><g><rect x="72" y="296" width="296" height="140" rx="4" style="fill:#262626;stroke:#78A9FF" stroke-width="1"/><rect x="88" y="311" width="7" height="7" style="fill:#78A9FF"/><text x="102" y="318" class="eye" style="fill:#A6C8FF">PARENT RECIPE</text><text x="88" y="342" class="h">db2u-instance-helper-parent</text><text x="88" y="364" class="b">Pause and unpause annotations</text><text x="88" y="383" class="b">Target namespace display name annotation</text><text x="88" y="402" class="m">hooks run in the helper pod</text></g><g><rect x="72" y="484" width="296" height="116" rx="4" style="fill:#262626;stroke:#08BDBA" stroke-width="1"/><rect x="88" y="499" width="7" height="7" style="fill:#08BDBA"/><text x="102" y="506" class="eye" style="fill:#3DDBD9">CHILD RECIPE</text><text x="88" y="530" class="h">db2u-instance-helper-child</text><text x="88" y="552" class="b">instance-backup, instance-restore</text><text x="88" y="571" class="m">found by parent-recipe label</text></g><path d="M220 254V292" fill="none" style="stroke:#C6C6C6" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-architecture-dark-m-neu)"/><rect x="226.0" y="266" width="43.5" height="17" rx="3" style="fill:#161616"/><text x="232" y="278" class="lab" text-anchor="start">names</text><path d="M220 438V480" fill="none" style="stroke:#C6C6C6" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-architecture-dark-m-neu)"/><rect x="226.0" y="452" width="100.2" height="17" rx="3" style="fill:#161616"/><text x="232" y="464" class="lab" text-anchor="start">finds by label</text><g><rect x="532" y="152" width="596" height="116" rx="4" style="fill:#262626;stroke:#78A9FF" stroke-width="1"/><rect x="548" y="167" width="7" height="7" style="fill:#78A9FF"/><text x="562" y="174" class="eye" style="fill:#A6C8FF">NAMESPACE</text><text x="548" y="198" class="h">recipe-helper</text><text x="548" y="220" class="b">maintenance-mode-on/off for instance + engine</text><text x="548" y="239" class="m">not backed up · parent recipe hooks</text></g><g><rect x="532" y="300" width="596" height="200" rx="4" style="fill:#262626;stroke:#08BDBA" stroke-width="1"/><rect x="548" y="315" width="7" height="7" style="fill:#08BDBA"/><text x="562" y="322" class="eye" style="fill:#3DDBD9">NAMESPACE · BACKUP SCOPE</text><text x="548" y="346" class="h">db2u-instance</text></g><rect x="556" y="372" width="164" height="64" rx="0" style="fill:#262626;stroke:#393939" stroke-width="1"/><text x="570" y="399" class="h">Pod</text><text x="570" y="418" class="m">container db2u</text><rect x="748" y="372" width="164" height="64" rx="0" style="fill:#262626;stroke:#393939" stroke-width="1"/><text x="762" y="399" class="h">Db2uInstance</text><text x="762" y="418" class="m">dwdb</text><rect x="940" y="372" width="164" height="64" rx="0" style="fill:#262626;stroke:#393939" stroke-width="1"/><text x="954" y="399" class="h">Db2uEngine</text><text x="954" y="418" class="m">db2wh engine</text><text x="846" y="476" class="m">configmaps · secrets · PVCs</text><g><rect x="532" y="532" width="596" height="68" rx="4" style="fill:#262626;stroke:#6F6F6F" stroke-width="1"/><rect x="548" y="547" width="7" height="7" style="fill:#6F6F6F"/><text x="562" y="554" class="eye" style="fill:#C6C6C6">NAMESPACE</text><text x="1112" y="578" class="m" text-anchor="end">not backed up · no recipe hooks</text><text x="548" y="578" class="h">db2-operator</text></g><path d="M368 330H450V210H528" fill="none" style="stroke:#78A9FF" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-architecture-dark-m-pri)"/><rect x="390.4" y="310" width="37.2" height="17" rx="3" style="fill:#161616"/><text x="409" y="322" class="lab" text-anchor="middle">exec</text><path d="M368 542H470V456H638V440" fill="none" style="stroke:#08BDBA" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-architecture-dark-m-sec)"/><rect x="542.0" y="448" width="37.2" height="17" rx="3" style="fill:#262626"/><text x="548" y="460" class="lab" text-anchor="start">exec</text><path d="M830 268V368" fill="none" style="stroke:#78A9FF" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-architecture-dark-m-pri)"/><path d="M1022 268V368" fill="none" style="stroke:#78A9FF" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-architecture-dark-m-pri)"/><rect x="604.1" y="277" width="219.9" height="17" rx="3" style="fill:#161616"/><text x="818" y="289" class="lab" text-anchor="end">PATCH maintenance-pause-reconcile</text><path d="M830 532V440" fill="none" style="stroke:#C6C6C6" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-architecture-dark-m-neu)"/><rect x="836.0" y="509" width="75.0" height="17" rx="3" style="fill:#161616"/><text x="842" y="521" class="lab" text-anchor="start">reconciles</text></svg>
