<svg xmlns="http://www.w3.org/2000/svg" id="db2u-transform-light" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-labelledby="db2u-transform-light-t db2u-transform-light-d"><title id="db2u-transform-light-t">Cross-namespace restore</title><desc id="db2u-transform-light-d">Cross-namespace restore: namespaceMapping moves objects from db2u-instance to db2u-instance-dev, the Transform rewrites affinity and environment labels from prod to dev and adds backup=restored on the instance and PVCs, and helper-exec sets the Project display name. The helper namespace maps to itself.</desc><style>#db2u-transform-light text{font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}#db2u-transform-light .ttl{font-size:20px;font-weight:600;fill:#161616;letter-spacing:-0.01em}#db2u-transform-light .sub{font-size:13px;fill:#525252}#db2u-transform-light .fig{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;font-weight:500;fill:#8D8D8D;letter-spacing:0.08em}#db2u-transform-light .eye{font-size:10.5px;font-weight:600;letter-spacing:0.06em;font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}#db2u-transform-light .h{font-size:14px;font-weight:600;fill:#161616}#db2u-transform-light .hm{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:13px;font-weight:600;fill:#161616}#db2u-transform-light .gh{font-size:13px;font-weight:600;fill:#161616}#db2u-transform-light .b{font-size:12.5px;fill:#161616}#db2u-transform-light .m{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;fill:#525252}#db2u-transform-light .mv{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:500;fill:#161616}#db2u-transform-light .lab{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10.5px;fill:#525252}#db2u-transform-light .labd{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10.5px;font-weight:500;fill:#750E13}#db2u-transform-light .hd{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10.5px;font-weight:500;fill:#8D8D8D;letter-spacing:0.08em}</style><defs><marker id="db2u-transform-light-m-neu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#525252" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-transform-light-m-pri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#0F62FE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-transform-light-m-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#007D79" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-transform-light-m-cau" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#B28600" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-transform-light-m-dan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#A2191F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><pattern id="db2u-transform-light-pat" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" style="fill:#E8E8E8"/></pattern></defs><rect width="1200" height="580" rx="10" style="fill:#F4F4F4"/><rect width="1200" height="580" rx="10" fill="url(#db2u-transform-light-pat)"/><text x="40" y="52" class="ttl">Cross-namespace restore</text><text x="40" y="76" class="sub">What each field on the restored objects becomes, and what changes it.</text><text x="1160" y="52" class="fig" text-anchor="end">FIG 4</text><rect x="24" y="96" width="1152" height="452" rx="8" style="fill:none;stroke:#8D8D8D" stroke-width="1" stroke-dasharray="5 4"/><text x="48" y="126" class="hd">FIELD</text><text x="340" y="126" class="hd">SOURCE · db2u-instance</text><text x="700" y="126" class="hd" text-anchor="middle">CHANGED BY</text><text x="860" y="126" class="hd">TARGET · db2u-instance-dev</text><path d="M48 138H1152" style="stroke:#E0E0E0" stroke-width="1"/><text x="48" y="163" class="h">Namespace</text><text x="48" y="182" class="m">metadata.namespace</text><text x="340" y="171" class="mv" style="fill:#525252">db2u-instance</text><path d="M560 167H631.8" fill="none" style="stroke:#525252" stroke-width="1.25" stroke-linejoin="round" stroke-dasharray="2 3"/><path d="M768.2 167H850" fill="none" style="stroke:#525252" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-transform-light-m-neu)"/><rect x="637.8" y="155" width="124.4" height="24" rx="12" style="fill:#F4F4F4;stroke:#A8A8A8" stroke-width="1"/><text x="700" y="171" class="lab" text-anchor="middle" style="fill:#525252">namespaceMapping</text><rect x="856" y="154" width="142.4" height="26" rx="5" style="fill:#F4F4F4"/><text x="866" y="171" class="mv" style="fill:#525252">db2u-instance-dev</text><path d="M48 194H1152" style="stroke:#E0E0E0" stroke-width="1" stroke-dasharray="1 3"/><text x="48" y="219" class="h">Db2uInstance</text><text x="48" y="238" class="m">affinity … values[0]</text><text x="340" y="227" class="mv" style="fill:#525252">prod</text><path d="M560 223H622.2" fill="none" style="stroke:#0F62FE" stroke-width="1.25" stroke-li