<svg xmlns="http://www.w3.org/2000/svg" id="db2u-workflow" viewBox="0 0 1200 922" width="1200" height="922" role="img" aria-labelledby="db2u-workflow-t db2u-workflow-d"><title id="db2u-workflow-t">Recipe workflow</title><desc id="db2u-workflow-d">Recipe workflow. Backup: the parent pauses the Db2uInstance and Db2uEngine from the helper pod; the child backs up configmaps, secrets and the Db2uInstance, suspends writes, snapshots the volumes and resumes; the parent unpauses the engine and the instance. On failure, inverseOps undo the completed steps. Restore: the parent sets the project display name; the child restores the volumes, configmaps, secrets and the paused Db2uInstance, waits for the engine, runs the snapshot restore and waits for the instance; the parent waits 300 seconds, then unpauses the engine and the instance.</desc><style>#db2u-workflow{--sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;--mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;--bg:#FFFFFF;--panel:#FFFFFF;--line:#E0E0E0;--ink:#161616;--muted:#525252;--faint:#8D8D8D;--grid:#E8E8E8;--priF:#EDF5FF;--priL:#0F62FE;--priI:#0043CE;--secF:#D9FBFB;--secL:#007D79;--secI:#005D5D;--neuF:#F4F4F4;--neuL:#A8A8A8;--neuI:#525252;--cauF:#FCF4D6;--cauL:#B28600;--cauI:#684E00;--danF:#FFF1F1;--danL:#A2191F;--danI:#750E13}@media (prefers-color-scheme: dark){#db2u-workflow{--bg:#161616;--panel:#262626;--line:#393939;--ink:#F4F4F4;--muted:#C6C6C6;--faint:#8D8D8D;--grid:#1F1F1F;--priF:#001141;--priL:#78A9FF;--priI:#A6C8FF;--secF:#081A1C;--secL:#08BDBA;--secI:#3DDBD9;--neuF:#262626;--neuL:#6F6F6F;--neuI:#C6C6C6;--cauF:#1C1500;--cauL:#D2A106;--cauI:#FDDC69;--danF:#2D0709;--danL:#FA4D56;--danI:#FFB3B8}}#db2u-workflow text{font-family:var(--sans)}#db2u-workflow .ttl{font-size:20px;font-weight:600;fill:var(--ink);letter-spacing:-0.01em}#db2u-workflow .sub{font-size:13px;fill:var(--muted)}#db2u-workflow .fig{font-family:var(--mono);font-size:11px;font-weight:500;fill:var(--faint);letter-spacing:0.08em}#db2u-workflow .eye{font-size:10.5px;font-weight:600;letter-spacing:0.06em;font-family:var(--mono)}#db2u-workflow .h{font-size:14px;font-weight:600;fill:var(--ink)}#db2u-workflow .hm{font-family:var(--mono);font-size:13px;font-weight:600;fill:var(--ink)}#db2u-workflow .gh{font-size:13px;font-weight:600;fill:var(--ink)}#db2u-workflow .b{font-size:12.5px;fill:var(--ink)}#db2u-workflow .m{font-family:var(--mono);font-size:11px;fill:var(--muted)}#db2u-workflow .mv{font-family:var(--mono);font-size:12px;font-weight:500;fill:var(--ink)}#db2u-workflow .lab{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}#db2u-workflow .labd{font-family:var(--mono);font-size:10.5px;font-weight:500;fill:var(--danI)}#db2u-workflow .hd{font-family:var(--mono);font-size:10.5px;font-weight:500;fill:var(--faint);letter-spacing:0.08em}</style><defs><marker id="db2u-workflow-m-neu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-workflow-m-pri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:var(--priL)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-workflow-m-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:var(--secL)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-workflow-m-cau" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:var(--cauL)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-workflow-m-dan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:var(--danL)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><pattern id="db2u-workflow-pat" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" style="fill:var(--grid)"/></pattern></defs><rect width="1200" height="922" rx="10" style="fill:var(--bg)"/><rect width="1200" height="922" rx="10" fill="url(#db2u-workflow-pat)"/><text x="40" y="52" class="ttl">Recipe workflow</text><text x="40" y="76" class="sub">Every step the parent's backup and restore workflows run, in order, with the child's workflow inside each.</text><text x="1160" y="52" class="fig" text-anchor="end">FIG 4</text><rect x="40" y="104" width="540" height="778" rx="8" style="fill:none;stroke:var(--faint)" stroke-width="1" stroke-dasharray="5 4"/><text x="60" y="134" class="gh">Backup</text><text x="560" y="134" class="m" text-anchor="end">workflow: backup</text><rect x="56" y="152" width="508" height="606" rx="4" style="fill:none;stroke:var(--priL)" stroke-width="1" stroke-dasharray="4 3"/><text x="72" y="174" class="eye" style="fill:var(--priI)">PARENT · BACKUP</text><rect x="72" y="186" width="476" height="34" rx="2" style="fill:var(--panel);stroke:var(--priL)" stroke-width="1"/><text x="86" y="208" class="lab" style="fill:var(--priI)">01</text><text x="112" y="208" class="hm">maintenance-mode-on</text><text x="534" y="208" class="m" text-anchor="end">pause Db2uInstance</text><path d="M310 220V231" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-m-neu)"/><rect x="72" y="234" width="476" height="34" rx="2" style="fill:var(--panel);stroke:var(--priL)" stroke-width="1"/><text x="86" y="256" class="lab" style="fill:var(--priI)">02</text><text x="112" y="256" class="hm">engine-maintenance-mode-on</text><text x="534" y="256" class="m" text-anchor="end">pause Db2uEngine</text><path d="M310 268V279" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-m-neu)"/><rect x="72" y="282" width="476" height="320" rx="4" style="fill:none;stroke:var(--secL)" stroke-width="1" stroke-dasharray="4 3"/><text x="88" y="304" class="eye" style="fill:var(--secI)">CHILD · INSTANCE-BACKUP</text><rect x="88" y="316" width="444" height="34" rx="2" style="fill:var(--panel);stroke:var(--secL)" stroke-width="1"/><text x="102" y="338" class="lab" style="fill:var(--secI)">03</text><text x="128" y="338" class="hm">db2u-resources</text><text x="518" y="338" class="m" text-anchor="end">configmaps, secrets</text><path d="M310 350V361" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-m-neu)"/><rect x="88" y="364" width="444" height="34" rx="2" style="fill:var(--panel);stroke:var(--secL)" stroke-width="1"/><text x="102" y="386" class="lab" style="fill:var(--secI)">04</text><text x="128" y="386" class="hm">db2u-db2uinstances</text><text x="518" y="386" class="m" text-anchor="end">Db2uInstance, paused</text><path d="M310 398V409" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-m-neu)"/><rect x="88" y="412" width="444" height="34" rx="2" style="fill:var(--panel);stroke:var(--cauL)" stroke-width="1"/><text x="102" y="434" class="lab" style="fill:var(--cauI)">05</text><text x="128" y="434" class="hm">suspend</text><text x="518" y="434" class="m" text-anchor="end">manage_snapshots suspend</text><path d="M310 446V457" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-m-neu)"/><rect x="88" y="460" width="444" height="34" rx="2" style="fill:var(--panel);stroke:var(--secL)" stroke-width="1"/><text x="102" y="482" class="lab" style="fill:var(--secI)">06</text><text x="128" y="482" class="hm">db2u-volumes</text><text x="518" y="482" class="m" text-anchor="end">volume snapshots</text><path d="M310 494V505" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-m-neu)"/><rect x="88" y="508" width="444" height="34" rx="2" style="fill:var(--panel);stroke:var(--secL)" stroke-width="1"/><text x="102" y="530" class="lab" style="fill:var(--secI)">07</text><text x="128" y="530" class="hm">resume</text><text x="518" y="530" class="m" text-anchor="end">writes resume</text><path d="M310 602V613" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-m-neu)"/><rect x="72" y="616" width="476" height="34" rx="2" style="fill:var(--panel);stroke:var(--priL)" stroke-width="1"/><text x="86" y="638" class="lab" style="fill:var(--priI)">08</text><text x="112" y="638" class="hm">engine-maintenance-mode-off</text><text x="534" y="638" class="m" text-anchor="end">unpause Db2uEngine</text><path d="M310 650V661" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-m-neu)"/><rect x="72" y="664" width="476" height="34" rx="2" style="fill:var(--panel);stroke:var(--priL)" stroke-width="1"/><text x="86" y="686" class="lab" style="fill:var(--priI)">09</text><text x="112" y="686" class="hm">maintenance-mode-off</text><text x="534" y="686" class="m" text-anchor="end">unpause Db2uInstance</text><g><rect x="56" y="774" width="508" height="84" rx="4" style="fill:var(--panel);stroke:var(--danL)" stroke-width="1"/><rect x="72" y="789" width="7" height="7" style="fill:var(--danL)"/><text x="86" y="796" class="eye" style="fill:var(--danI)">ON FAILURE</text><text x="72" y="820" class="h">Completed steps are undone</text><text x="72" y="842" class="m">inverseOps keep the database active after a failure</text></g><rect x="620" y="104" width="540" height="778" rx="8" style="fill:none;stroke:var(--faint)" stroke-width="1" stroke-dasharray="5 4"/><text x="640" y="134" class="gh">Restore</text><text x="1140" y="134" class="m" text-anchor="end">workflow: restore</text><rect x="636" y="152" width="508" height="606" rx="4" style="fill:none;stroke:var(--priL)" stroke-width="1" stroke-dasharray="4 3"/><text x="652" y="174" class="eye" style="fill:var(--priI)">PARENT · RESTORE</text><rect x="652" y="186" width="476" height="34" rx="2" style="fill:var(--panel);stroke:var(--priL)" stroke-width="1"/><text x="666" y="208" class="lab" style="fill:var(--priI)">01</text><text x="692" y="208" class="hm">set-display-name</text><text x="1114" y="208" class="m" text-anchor="end">name the target project</text><path d="M890 220V279" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-m-neu)"/><rect x="652" y="282" width="476" height="320" rx="4" style="fill:none;stroke:var(--secL)" stroke-width="1" stroke-dasharray="4 3"/><text x="668" y="304" class="eye" style="fill:var(--secI)">CHILD · INSTANCE-RESTORE</text><rect x="668" y="316" width="444" height="34" rx="2" style="fill:var(--panel);stroke:var(--secL)" stroke-width="1"/><text x="682" y="338" class="lab" style="fill:var(--secI)">02</text><text x="708" y="338" class="hm">db2u-volumes</text><text x="1098" y="338" class="m" text-anchor="end">PVCs from snapshots</text><path d="M890 350V361" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-m-neu)"/><rect x="668" y="364" width="444" height="34" rx="2" style="fill:var(--panel);stroke:var(--secL)" stroke-width="1"/><text x="682" y="386" class="lab" style="fill:var(--secI)">03</text><text x="708" y="386" class="hm">db2u-resources</text><text x="1098" y="386" class="m" text-anchor="end">configmaps, secrets</text><path d="M890 398V409" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-m-neu)"/><rect x="668" y="412" width="444" height="34" rx="2" style="fill:var(--panel);stroke:var(--secL)" stroke-width="1"/><text x="682" y="434" class="lab" style="fill:var(--secI)">04</text><text x="708" y="434" class="hm">db2u-db2uinstances</text><text x="1098" y="434" class="m" text-anchor="end">Db2uInstance, still paused</text><path d="M890 446V457" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-m-neu)"/><rect x="668" y="460" width="444" height="34" rx="2" style="fill:var(--panel);stroke:var(--neuL)" stroke-width="1"/><text x="682" y="482" class="lab" style="fill:var(--neuI)">05</text><text x="708" y="482" class="hm">db2uengine-check</text><text x="1098" y="482" class="m" text-anchor="end">wait for engine Ready</text><path d="M890 494V505" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-m-neu)"/><rect x="668" y="508" width="444" height="34" rx="2" style="fill:var(--panel);stroke:var(--secL)" stroke-width="1"/><text x="682" y="530" class="lab" style="fill:var(--secI)">06</text><text x="708" y="530" class="hm">restore</text><text x="1098" y="530" class="m" text-anchor="end">manage_snapshots restore</text><path d="M890 542V553" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-m-neu)"/><rect x="668" y="556" width="444" height="34" rx="2" style="fill:var(--panel);stroke:var(--neuL)" stroke-width="1"/><text x="682" y="578" class="lab" style="fill:var(--neuI)">07</text><text x="708" y="578" class="hm">db2uinstance-check</text><text x="1098" y="578" class="m" text-anchor="end">wait for instance Ready</text><path d="M890 602V613" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-m-neu)"/><rect x="652" y="616" width="476" height="34" rx="2" style="fill:var(--panel);stroke:var(--priL)" stroke-width="1"/><text x="666" y="638" class="lab" style="fill:var(--priI)">08</text><text x="692" y="638" class="hm">sleep-after-restore</text><text x="1114" y="638" class="m" text-anchor="end">settle 300 s</text><path d="M890 650V661" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-m-neu)"/><rect x="652" y="664" width="476" height="34" rx="2" style="fill:var(--panel);stroke:var(--priL)" stroke-width="1"/><text x="666" y="686" class="lab" style="fill:var(--priI)">09</text><text x="692" y="686" class="hm">engine-maintenance-mode-off</text><text x="1114" y="686" class="m" text-anchor="end">unpause Db2uEngine</text><path d="M890 698V709" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-m-neu)"/><rect x="652" y="712" width="476" height="34" rx="2" style="fill:var(--panel);stroke:var(--priL)" stroke-width="1"/><text x="666" y="734" class="lab" style="fill:var(--priI)">10</text><text x="692" y="734" class="hm">maintenance-mode-off</text><text x="1114" y="734" class="m" text-anchor="end">unpause Db2uInstance</text><g><rect x="636" y="774" width="508" height="84" rx="4" style="fill:var(--panel);stroke:var(--cauL)" stroke-width="1"/><rect x="652" y="789" width="7" height="7" style="fill:var(--cauL)"/><text x="666" y="796" class="eye" style="fill:var(--cauI)">TRANSFORM</text><text x="652" y="820" class="h">Restored objects are updated</text><text x="652" y="842" class="m">Transforms enable cross-namespace restores</text></g></svg>
