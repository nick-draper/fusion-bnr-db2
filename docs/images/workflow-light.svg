<svg xmlns="http://www.w3.org/2000/svg" id="db2u-workflow-light" viewBox="0 0 1200 922" width="1200" height="922" role="img" aria-labelledby="db2u-workflow-light-t db2u-workflow-light-d"><title id="db2u-workflow-light-t">Recipe workflow</title><desc id="db2u-workflow-light-d">Recipe workflow. Backup: the parent pauses the Db2uInstance and Db2uEngine from the helper pod; the child backs up configmaps, secrets and the Db2uInstance, suspends writes, snapshots the volumes and resumes; the parent unpauses the engine and the instance. On failure, inverseOps undo the completed steps. Restore: the parent sets the project display name; the child restores the volumes, configmaps, secrets and the paused Db2uInstance, waits for the engine, runs the snapshot restore and waits for the instance; the parent waits 300 seconds, then unpauses the engine and the instance.</desc><style>#db2u-workflow-light text{font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}#db2u-workflow-light .ttl{font-size:20px;font-weight:600;fill:#161616;letter-spacing:-0.01em}#db2u-workflow-light .sub{font-size:13px;fill:#525252}#db2u-workflow-light .fig{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;font-weight:500;fill:#8D8D8D;letter-spacing:0.08em}#db2u-workflow-light .eye{font-size:10.5px;font-weight:600;letter-spacing:0.06em;font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}#db2u-workflow-light .h{font-size:14px;font-weight:600;fill:#161616}#db2u-workflow-light .hm{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:13px;font-weight:600;fill:#161616}#db2u-workflow-light .gh{font-size:13px;font-weight:600;fill:#161616}#db2u-workflow-light .b{font-size:12.5px;fill:#161616}#db2u-workflow-light .m{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;fill:#525252}#db2u-workflow-light .mv{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:500;fill:#161616}#db2u-workflow-light .lab{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10.5px;fill:#525252}#db2u-workflow-light .labd{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10.5px;font-weight:500;fill:#750E13}#db2u-workflow-light .hd{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10.5px;font-weight:500;fill:#8D8D8D;letter-spacing:0.08em}</style><defs><marker id="db2u-workflow-light-m-neu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#525252" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-workflow-light-m-pri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#0F62FE" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-workflow-light-m-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#007D79" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-workflow-light-m-cau" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#B28600" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-workflow-light-m-dan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#A2191F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><pattern id="db2u-workflow-light-pat" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" style="fill:#E8E8E8"/></pattern></defs><rect width="1200" height="922" rx="10" style="fill:#FFFFFF"/><rect width="1200" height="922" rx="10" fill="url(#db2u-workflow-light-pat)"/><text x="40" y="52" class="ttl">Recipe workflow</text><text x="40" y="76" class="sub">Every step the parent's backup and restore workflows run, in order, with the child's workflow inside each.</text><text x="1160" y="52" class="fig" text-anchor="end">FIG 4</text><rect x="40" y="104" width="540" height="778" rx="8" style="fill:none;stroke:#8D8D8D" stroke-width="1" stroke-dasharray="5 4"/><text x="60" y="134" class="gh">Backup</text><text x="560" y="134" class="m" text-anchor="end">workflow: backup</text><rect x="56" y="152" width="508" height="606" rx="4" style="fill:none;stroke:#0F62FE" stroke-width="1" stroke-dasharray="4 3"/><text x="72" y="174" class="eye" style="fill:#0043CE">PARENT · BACKUP</text><rect x="72" y="186" width="476" height="34" rx="2" style="fill:#FFFFFF;stroke:#0F62FE" stroke-width="1"/><text x="86" y="208" class="lab" style="fill:#0043CE">01</text><text x="112" y="208" class="hm">maintenance-mode-on</text><text x="534" y="208" class="m" text-anchor="end">pause Db2uInstance</text><path d="M310 220V231" fill="none" style="stroke:#525252" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-light-m-neu)"/><rect x="72" y="234" width="476" height="34" rx="2" style="fill:#FFFFFF;stroke:#0F62FE" stroke-width="1"/><text x="86" y="256" class="lab" style="fill:#0043CE">02</text><text x="112" y="256" class="hm">engine-maintenance-mode-on</text><text x="534" y="256" class="m" text-anchor="end">pause Db2uEngine</text><path d="M310 268V279" fill="none" style="stroke:#525252" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-light-m-neu)"/><rect x="72" y="282" width="476" height="320" rx="4" style="fill:none;stroke:#007D79" stroke-width="1" stroke-dasharray="4 3"/><text x="88" y="304" class="eye" style="fill:#005D5D">CHILD · INSTANCE-BACKUP</text><rect x="88" y="316" width="444" height="34" rx="2" style="fill:#FFFFFF;stroke:#007D79" stroke-width="1"/><text x="102" y="338" class="lab" style="fill:#005D5D">03</text><text x="128" y="338" class="hm">db2u-resources</text><text x="518" y="338" class="m" text-anchor="end">configmaps, secrets</text><path d="M310 350V361" fill="none" style="stroke:#525252" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-light-m-neu)"/><rect x="88" y="364" width="444" height="34" rx="2" style="fill:#FFFFFF;stroke:#007D79" stroke-width="1"/><text x="102" y="386" class="lab" style="fill:#005D5D">04</text><text x="128" y="386" class="hm">db2u-db2uinstances</text><text x="518" y="386" class="m" text-anchor="end">Db2uInstance, paused</text><path d="M310 398V409" fill="none" style="stroke:#525252" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-light-m-neu)"/><rect x="88" y="412" width="444" height="34" rx="2" style="fill:#FFFFFF;stroke:#B28600" stroke-width="1"/><text x="102" y="434" class="lab" style="fill:#684E00">05</text><text x="128" y="434" class="hm">suspend</text><text x="518" y="434" class="m" text-anchor="end">manage_snapshots suspend</text><path d="M310 446V457" fill="none" style="stroke:#525252" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-light-m-neu)"/><rect x="88" y="460" width="444" height="34" rx="2" style="fill:#FFFFFF;stroke:#007D79" stroke-width="1"/><text x="102" y="482" class="lab" style="fill:#005D5D">06</text><text x="128" y="482" class="hm">db2u-volumes</text><text x="518" y="482" class="m" text-anchor="end">volume snapshots</text><path d="M310 494V505" fill="none" style="stroke:#525252" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-light-m-neu)"/><rect x="88" y="508" width="444" height="34" rx="2" style="fill:#FFFFFF;stroke:#007D79" stroke-width="1"/><text x="102" y="530" class="lab" style="fill:#005D5D">07</text><text x="128" y="530" class="hm">resume</text><text x="518" y="530" class="m" text-anchor="end">writes resume</text><path d="M310 602V613" fill="none" style="stroke:#525252" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-light-m-neu)"/><rect x="72" y="616" width="476" height="34" rx="2" style="fill:#FFFFFF;stroke:#0F62FE" stroke-width="1"/><text x="86" y="638" class="lab" style="fill:#0043CE">08</text><text x="112" y="638" class="hm">engine-maintenance-mode-off</text><text x="534" y="638" class="m" text-anchor="end">unpause Db2uEngine</text><path d="M310 650V661" fill="none" style="stroke:#525252" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-light-m-neu)"/><rect x="72" y="664" width="476" height="34" rx="2" style="fill:#FFFFFF;stroke:#0F62FE" stroke-width="1"/><text x="86" y="686" class="lab" style="fill:#0043CE">09</text><text x="112" y="686" class="hm">maintenance-mode-off</text><text x="534" y="686" class="m" text-anchor="end">unpause Db2uInstance</text><g><rect x="56" y="774" width="508" height="84" rx="4" style="fill:#FFFFFF;stroke:#A2191F" stroke-width="1"/><rect x="72" y="789" width="7" height="7" style="fill:#A2191F"/><text x="86" y="796" class="eye" style="fill:#750E13">ON FAILURE</text><text x="72" y="820" class="h">Completed steps are undone</text><text x="72" y="842" class="m">inverseOps keep the database active after a failure</text></g><rect x="620" y="104" width="540" height="778" rx="8" style="fill:none;stroke:#8D8D8D" stroke-width="1" stroke-dasharray="5 4"/><text x="640" y="134" class="gh">Restore</text><text x="1140" y="134" class="m" text-anchor="end">workflow: restore</text><rect x="636" y="152" width="508" height="606" rx="4" style="fill:none;stroke:#0F62FE" stroke-width="1" stroke-dasharray="4 3"/><text x="652" y="174" class="eye" style="fill:#0043CE">PARENT · RESTORE</text><rect x="652" y="186" width="476" height="34" rx="2" style="fill:#FFFFFF;stroke:#0F62FE" stroke-width="1"/><text x="666" y="208" class="lab" style="fill:#0043CE">01</text><text x="692" y="208" class="hm">set-display-name</text><text x="1114" y="208" class="m" text-anchor="end">name the target project</text><path d="M890 220V279" fill="none" style="stroke:#525252" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-light-m-neu)"/><rect x="652" y="282" width="476" height="320" rx="4" style="fill:none;stroke:#007D79" stroke-width="1" stroke-dasharray="4 3"/><text x="668" y="304" class="eye" style="fill:#005D5D">CHILD · INSTANCE-RESTORE</text><rect x="668" y="316" width="444" height="34" rx="2" style="fill:#FFFFFF;stroke:#007D79" stroke-width="1"/><text x="682" y="338" class="lab" style="fill:#005D5D">02</text><text x="708" y="338" class="hm">db2u-volumes</text><text x="1098" y="338" class="m" text-anchor="end">PVCs from snapshots</text><path d="M890 350V361" fill="none" style="stroke:#525252" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-light-m-neu)"/><rect x="668" y="364" width="444" height="34" rx="2" style="fill:#FFFFFF;stroke:#007D79" stroke-width="1"/><text x="682" y="386" class="lab" style="fill:#005D5D">03</text><text x="708" y="386" class="hm">db2u-resources</text><text x="1098" y="386" class="m" text-anchor="end">configmaps, secrets</text><path d="M890 398V409" fill="none" style="stroke:#525252" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-light-m-neu)"/><rect x="668" y="412" width="444" height="34" rx="2" style="fill:#FFFFFF;stroke:#007D79" stroke-width="1"/><text x="682" y="434" class="lab" style="fill:#005D5D">04</text><text x="708" y="434" class="hm">db2u-db2uinstances</text><text x="1098" y="434" class="m" text-anchor="end">Db2uInstance, still paused</text><path d="M890 446V457" fill="none" style="stroke:#525252" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-light-m-neu)"/><rect x="668" y="460" width="444" height="34" rx="2" style="fill:#FFFFFF;stroke:#A8A8A8" stroke-width="1"/><text x="682" y="482" class="lab" style="fill:#525252">05</text><text x="708" y="482" class="hm">db2uengine-check</text><text x="1098" y="482" class="m" text-anchor="end">wait for engine Ready</text><path d="M890 494V505" fill="none" style="stroke:#525252" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-light-m-neu)"/><rect x="668" y="508" width="444" height="34" rx="2" style="fill:#FFFFFF;stroke:#007D79" stroke-width="1"/><text x="682" y="530" class="lab" style="fill:#005D5D">06</text><text x="708" y="530" class="hm">restore</text><text x="1098" y="530" class="m" text-anchor="end">manage_snapshots restore</text><path d="M890 542V553" fill="none" style="stroke:#525252" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-light-m-neu)"/><rect x="668" y="556" width="444" height="34" rx="2" style="fill:#FFFFFF;stroke:#A8A8A8" stroke-width="1"/><text x="682" y="578" class="lab" style="fill:#525252">07</text><text x="708" y="578" class="hm">db2uinstance-check</text><text x="1098" y="578" class="m" text-anchor="end">wait for instance Ready</text><path d="M890 602V613" fill="none" style="stroke:#525252" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-light-m-neu)"/><rect x="652" y="616" width="476" height="34" rx="2" style="fill:#FFFFFF;stroke:#0F62FE" stroke-width="1"/><text x="666" y="638" class="lab" style="fill:#0043CE">08</text><text x="692" y="638" class="hm">sleep-after-restore</text><text x="1114" y="638" class="m" text-anchor="end">settle 300 s</text><path d="M890 650V661" fill="none" style="stroke:#525252" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-light-m-neu)"/><rect x="652" y="664" width="476" height="34" rx="2" style="fill:#FFFFFF;stroke:#0F62FE" stroke-width="1"/><text x="666" y="686" class="lab" style="fill:#0043CE">09</text><text x="692" y="686" class="hm">engine-maintenance-mode-off</text><text x="1114" y="686" class="m" text-anchor="end">unpause Db2uEngine</text><path d="M890 698V709" fill="none" style="stroke:#525252" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-workflow-light-m-neu)"/><rect x="652" y="712" width="476" height="34" rx="2" style="fill:#FFFFFF;stroke:#0F62FE" stroke-width="1"/><text x="666" y="734" class="lab" style="fill:#0043CE">10</text><text x="692" y="734" class="hm">maintenance-mode-off</text><text x="1114" y="734" class="m" text-anchor="end">unpause Db2uInstance</text><g><rect x="636" y="774" width="508" height="84" rx="4" style="fill:#FFFFFF;stroke:#B28600" stroke-width="1"/><rect x="652" y="789" width="7" height="7" style="fill:#B28600"/><text x="666" y="796" class="eye" style="fill:#684E00">TRANSFORM</text><text x="652" y="820" class="h">Restored objects are updated</text><text x="652" y="842" class="m">Transforms enable cross-namespace restores</text></g></svg>
