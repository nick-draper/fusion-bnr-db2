<svg xmlns="http://www.w3.org/2000/svg" id="db2u-failover-dark" viewBox="0 0 1200 452" width="1200" height="452" role="img" aria-labelledby="db2u-failover-dark-t db2u-failover-dark-d"><title id="db2u-failover-dark-t">Backup failure undo</title><desc id="db2u-failover-dark-d">Backup failure undo: the backup pauses the instance, pauses the engine, suspends writes and snapshots the volumes. A failure at any of the later steps runs the inverseOp of every step already completed, newest first: resume writes, unpause the engine, unpause the instance.</desc><style>#db2u-failover-dark text{font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}#db2u-failover-dark .ttl{font-size:20px;font-weight:600;fill:#F4F4F4;letter-spacing:-0.01em}#db2u-failover-dark .sub{font-size:13px;fill:#C6C6C6}#db2u-failover-dark .fig{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;font-weight:500;fill:#8D8D8D;letter-spacing:0.08em}#db2u-failover-dark .eye{font-size:10.5px;font-weight:600;letter-spacing:0.06em;font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}#db2u-failover-dark .h{font-size:14px;font-weight:600;fill:#F4F4F4}#db2u-failover-dark .hm{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:13px;font-weight:600;fill:#F4F4F4}#db2u-failover-dark .gh{font-size:13px;font-weight:600;fill:#F4F4F4}#db2u-failover-dark .b{font-size:12.5px;fill:#F4F4F4}#db2u-failover-dark .m{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;fill:#C6C6C6}#db2u-failover-dark .mv{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:500;fill:#F4F4F4}#db2u-failover-dark .lab{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10.5px;fill:#C6C6C6}#db2u-failover-dark .labd{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10.5px;font-weight:500;fill:#FFB3B8}#db2u-failover-dark .hd{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10.5px;font-weight:500;fill:#8D8D8D;letter-spacing:0.08em}</style><defs><marker id="db2u-failover-dark-m-neu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#C6C6C6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-failover-dark-m-pri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#78A9FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-failover-dark-m-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#08BDBA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-failover-dark-m-cau" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#D2A106" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-failover-dark-m-dan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#FA4D56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><pattern id="db2u-failover-dark-pat" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" style="fill:#1F1F1F"/></pattern></defs><rect width="1200" height="452" rx="10" style="fill:#161616"/><rect width="1200" height="452" rx="10" fill="url(#db2u-failover-dark-pat)"/><text x="40" y="52" class="ttl">Backup failure undo</text><text x="40" y="76" class="sub">Each quiesce step names an inverseOp. A failure at any later step runs the completed steps' inverseOps, newest first.</text><text x="1160" y="52" class="fig" text-anchor="end">FIG 5</text><g><rect x="40" y="112" width="212" height="104" rx="4" style="fill:#262626;stroke:#78A9FF" stroke-width="1"/><rect x="56" y="127" width="7" height="7" style="fill:#78A9FF"/><text x="70" y="134" class="eye" style="fill:#A6C8FF">1 · PAUSE</text><text x="56" y="158" class="h">Db2uInstance</text><text x="56" y="180" class="m">maintenance-mode-on</text></g><path d="M254 154H266" fill="none" style="stroke:#C6C6C6" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-dark-m-neu)"/><g><rect x="268" y="112" width="212" height="104" rx="4" style="fill:#262626;stroke:#78A9FF" stroke-width="1"/><rect x="284" y="127" width="7" height="7" style="fill:#78A9FF"/><text x="298" y="134" class="eye" style="fill:#A6C8FF">2 · PAUSE</text><text x="284" y="158" class="h">Db2uEngine</text><text x="284" y="180" class="m">engine-maintenance-mode-on</text></g><path d="M482 154H494" fill="none" style="stroke:#C6C6C6" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-dark-m-neu)"/><g><rect x="496" y="112" width="212" height="104" rx="4" style="fill:#262626;stroke:#D2A106" stroke-width="1"/><rect x="512" y="127" width="7" height="7" style="fill:#D2A106"/><text x="526" y="134" class="eye" style="fill:#FDDC69">3 · QUIESCE</text><text x="512" y="158" class="h">suspend</text><text x="512" y="180" class="m">manage_snapshots</text></g><path d="M710 154H722" fill="none" style="stroke:#C6C6C6" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-dark-m-neu)"/><g><rect x="724" y="112" width="212" height="104" rx="4" style="fill:#262626;stroke:#6F6F6F" stroke-width="1"/><rect x="740" y="127" width="7" height="7" style="fill:#6F6F6F"/><text x="754" y="134" class="eye" style="fill:#C6C6C6">4 · SNAPSHOT</text><text x="740" y="158" class="h">db2u-volumes</text><text x="740" y="180" class="m">volume group</text></g><path d="M938 154H950" fill="none" style="stroke:#C6C6C6" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-dark-m-neu)"/><g><rect x="952" y="112" width="212" height="104" rx="4" style="fill:#262626;stroke:#08BDBA" stroke-width="1"/><rect x="968" y="127" width="7" height="7" style="fill:#08BDBA"/><text x="982" y="134" class="eye" style="fill:#3DDBD9">5 · RESUME</text><text x="968" y="158" class="h">resume</text><text x="968" y="180" class="m">normal path</text></g><g><rect x="268" y="300" width="212" height="116" rx="4" style="fill:#262626;stroke:#FA4D56" stroke-width="1"/><rect x="284" y="315" width="7" height="7" style="fill:#FA4D56"/><text x="298" y="322" class="eye" style="fill:#FFB3B8">UNDO · INVERSEOP</text><text x="284" y="346" class="h">Unpause instance</text><text x="284" y="368" class="m">maintenance-mode-off</text><text x="284" y="387" class="b">Reverses step 1</text></g><path d="M374 218V297" fill="none" style="stroke:#FA4D56" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-dark-m-dan)"/><rect x="352.0" y="250" width="44.0" height="17" rx="3" style="fill:#161616"/><text x="374" y="262" class="labd" text-anchor="middle">fails</text><g><rect x="496" y="300" width="212" height="116" rx="4" style="fill:#262626;stroke:#FA4D56" stroke-width="1"/><rect x="512" y="315" width="7" height="7" style="fill:#FA4D56"/><text x="526" y="322" class="eye" style="fill:#FFB3B8">UNDO · INVERSEOP</text><text x="512" y="346" class="h">Unpause engine</text><text x="512" y="368" class="m">engine-maintenance-mode-off</text><text x="512" y="387" class="b">Reverses step 2</text></g><path d="M602 218V297" fill="none" style="stroke:#FA4D56" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-dark-m-dan)"/><rect x="580.0" y="250" width="44.0" height="17" rx="3" style="fill:#161616"/><text x="602" y="262" class="labd" text-anchor="middle">fails</text><g><rect x="724" y="300" width="212" height="116" rx="4" style="fill:#262626;stroke:#FA4D56" stroke-width="1"/><rect x="740" y="315" width="7" height="7" style="fill:#FA4D56"/><text x="754" y="322" class="eye" style="fill:#FFB3B8">UNDO · INVERSEOP</text><text x="740" y="346" class="h">Resume writes</text><text x="740" y="368" class="m">manage_snapshots resume</text><text x="740" y="387" class="b">Reverses step 3</text></g><path d="M830 218V297" fill="none" style="stroke:#FA4D56" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-dark-m-dan)"/><rect x="808.0" y="250" width="44.0" height="17" rx="3" style="fill:#161616"/><text x="830" y="262" class="labd" text-anchor="middle">fails</text><g><rect x="40" y="300" width="212" height="116" rx="4" style="fill:#262626;stroke:#08BDBA" stroke-width="1"/><rect x="56" y="315" width="7" height="7" style="fill:#08BDBA"/><text x="70" y="322" class="eye" style="fill:#3DDBD9">RESULT</text><text x="56" y="346" class="h">Source in service</text><text x="56" y="368" class="m">writable, reconciling</text><text x="56" y="387" class="b">Not a failover</text></g><path d="M722 346H710" fill="none" style="stroke:#FA4D56" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-dark-m-dan)"/><path d="M494 346H482" fill="none" style="stroke:#FA4D56" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-dark-m-dan)"/><path d="M266 346H254" fill="none" style="stroke:#FA4D56" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-failover-dark-m-dan)"/></svg>
