<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="depTitle depDesc">
  <title id="depTitle">Deploy order</title>
  <desc id="depDesc">Apply the Velero plugin and ClusterRole, then the parent and child recipes, label the instance, assign the parent recipe, then back up. Restore uses the transform and restore examples.</desc>
  <style>
    .bg { fill: #f4f7fb; }
    .h { font: 600 22px system-ui, Segoe UI, sans-serif; fill: #161616; }
    .b { font: 600 13px system-ui, Segoe UI, sans-serif; fill: #161616; }
    .m { font: 400 12px system-ui, Segoe UI, sans-serif; fill: #525252; }
  </style>
  <rect class="bg" width="1200" height="280" rx="16"/>
  <text class="h" x="32" y="44">Deploy order</text>

  <rect x="32" y="72" width="150" height="160" rx="12" fill="#fff8e1" stroke="#f1c21b" stroke-width="1.5"/>
  <text class="b" x="48" y="108">1 Plugin</text>
  <text class="m" x="48" y="136">db2u-velero-plugin</text>
  <text class="m" x="48" y="156">on the Fusion DPA</text>
  <text class="m" x="48" y="188">examples/</text>
  <text class="m" x="48" y="208">dpa reminder</text>

  <rect x="206" y="72" width="150" height="160" rx="12" fill="#edf5ff" stroke="#0f62fe" stroke-width="1.5"/>
  <text class="b" x="222" y="108">2 Access</text>
  <text class="m" x="222" y="136">restore-pre-req.sh</text>
  <text class="m" x="222" y="156">get, list, patch</text>
  <text class="m" x="222" y="188">backup-pre-req.sh</text>
  <text class="m" x="222" y="208">for-backup=true</text>

  <rect x="380" y="72" width="170" height="160" rx="12" fill="#edf5ff" stroke="#0f62fe" stroke-width="1.5"/>
  <text class="b" x="396" y="108">3 Recipes</text>
  <text class="m" x="396" y="136">parent, then child</text>
  <text class="m" x="396" y="156">recipe/*.yaml</text>
  <text class="m" x="396" y="188">Application includes</text>
  <text class="m" x="396" y="208">instance ns only</text>

  <rect x="574" y="72" width="170" height="160" rx="12" fill="#ffffff" stroke="#161616" stroke-width="1.5"/>
  <text class="b" x="590" y="108">4 Assign</text>
  <text class="m" x="590" y="136">PolicyAssignment</text>
  <text class="m" x="590" y="156">names the parent</text>
  <text class="m" x="590" y="188">before the first</text>
  <text class="m" x="590" y="208">backup</text>

  <rect x="768" y="72" width="150" height="160" rx="12" fill="#defbe6" stroke="#198038" stroke-width="1.5"/>
  <text class="b" x="784" y="108">5 Backup</text>
  <text class="m" x="784" y="136">Back up now</text>
  <text class="m" x="784" y="156">record Backup name</text>
  <text class="m" x="784" y="188">maintenance</text>
  <text class="m" x="784" y="208">annotation cleared</text>

  <rect x="942" y="72" width="220" height="160" rx="12" fill="#f6f2ff" stroke="#8a3ffc" stroke-width="1.5"/>
  <text class="b" x="958" y="108">6 Restore</text>
  <text class="m" x="958" y="136">create target project</text>
  <text class="m" x="958" y="156">edit examples/</text>
  <text class="m" x="958" y="188">Transform, then Restore</text>
  <text class="m" x="958" y="208">check license, not just Ready</text>

  <path d="M182 152 H206" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M356 152 H380" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M550 152 H574" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M744 152 H768" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M918 152 H942" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#161616"/></marker>
  </defs>
</svg>
