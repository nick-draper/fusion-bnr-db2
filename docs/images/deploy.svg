<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" role="img" aria-labelledby="depTitle depDesc">
  <title id="depTitle">Deploy order</title>
  <desc id="depDesc">Create the object storage bucket, policy, user and access key; scope the Db2 operator and create the projects and instance; configure Fusion Backup and Restore with the Velero plugin, storage location, policy, recipes, transform and policy assignment; deploy the recipe helper; then back up and restore.</desc>
  <style>
    .bg { fill: #f4f7fb; }
    .h { font: 600 22px system-ui, Segoe UI, sans-serif; fill: #161616; }
    .b { font: 600 13px system-ui, Segoe UI, sans-serif; fill: #161616; }
    .m { font: 400 12px system-ui, Segoe UI, sans-serif; fill: #525252; }
  </style>
  <rect class="bg" width="1200" height="280" rx="16"/>
  <text class="h" x="32" y="44">Deploy order</text>

  <rect x="32" y="72" width="208" height="176" rx="12" fill="#fff8e1" stroke="#f1c21b" stroke-width="1.5"/>
  <text class="b" x="48" y="108">1 Object storage</text>
  <text class="m" x="48" y="136">bucket, policy</text>
  <text class="m" x="48" y="156">user, access key</text>
  <text class="m" x="48" y="188">endpoint CA certificate</text>
  <text class="m" x="48" y="208">object-storage-setup.md</text>

  <rect x="264" y="72" width="208" height="176" rx="12" fill="#defbe6" stroke="#198038" stroke-width="1.5"/>
  <text class="b" x="280" y="108">2 Db2</text>
  <text class="m" x="280" y="136">OperatorGroup targets</text>
  <text class="m" x="280" y="156">namespace-scope ConfigMap</text>
  <text class="m" x="280" y="188">node environment labels</text>
  <text class="m" x="280" y="208">projects, Db2uInstance</text>
  <text class="m" x="280" y="228">resources/db2u-instance/</text>

  <rect x="496" y="72" width="208" height="176" rx="12" fill="#edf5ff" stroke="#0f62fe" stroke-width="1.5"/>
  <text class="b" x="512" y="108">3 Fusion BNR</text>
  <text class="m" x="512" y="136">db2u-velero-plugin on DPA</text>
  <text class="m" x="512" y="156">secret, location, policy</text>
  <text class="m" x="512" y="188">parent, child, transform</text>
  <text class="m" x="512" y="208">assign before first backup</text>
  <text class="m" x="512" y="228">resources/ibm-backup-restore/</text>

  <rect x="728" y="72" width="208" height="176" rx="12" fill="#edf5ff" stroke="#0f62fe" stroke-width="1.5"/>
  <text class="b" x="744" y="108">4 Recipe helper</text>
  <text class="m" x="744" y="136">project, service account</text>
  <text class="m" x="744" y="156">ClusterRole + binding</text>
  <text class="m" x="744" y="188">deployment (UBI + curl)</text>
  <text class="m" x="744" y="208">configure-recipe-helper.sh</text>
  <text class="m" x="744" y="228">backup and restore clusters</text>

  <rect x="960" y="72" width="208" height="176" rx="12" fill="#f6f2ff" stroke="#8a3ffc" stroke-width="1.5"/>
  <text class="b" x="976" y="108">5 Operations</text>
  <text class="m" x="976" y="136">Back up now / backup.yaml</text>
  <text class="m" x="976" y="156">record Backup name</text>
  <text class="m" x="976" y="188">restore.yaml: map helper ns</text>
  <text class="m" x="976" y="208">ENV via transformMapping</text>
  <text class="m" x="976" y="228">check license, not just Ready</text>

  <path d="M240 160 H264" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M472 160 H496" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M704 160 H728" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <path d="M936 160 H960" stroke="#161616" stroke-width="2" fill="none" marker-end="url(#a)"/>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#161616"/></marker>
  </defs>
</svg>
