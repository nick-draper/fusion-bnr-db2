<svg xmlns="http://www.w3.org/2000/svg" id="db2u-deploy" viewBox="0 0 1200 304" width="1200" height="304" role="img" aria-labelledby="db2u-deploy-t db2u-deploy-d"><title id="db2u-deploy-t">Deploy order</title><desc id="db2u-deploy-d">Deploy order: object storage, Db2 operator and instance, Fusion Backup and Restore, recipe helper, then back up and restore. Each step lists where it runs.</desc><style>#db2u-deploy{--sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;--mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;--bg:#FFFFFF;--panel:#FFFFFF;--line:#E0E0E0;--ink:#161616;--muted:#525252;--faint:#8D8D8D;--grid:#E8E8E8;--priF:#EDF5FF;--priL:#0F62FE;--priI:#0043CE;--secF:#D9FBFB;--secL:#007D79;--secI:#005D5D;--neuF:#F4F4F4;--neuL:#A8A8A8;--neuI:#525252;--cauF:#FCF4D6;--cauL:#B28600;--cauI:#684E00;--danF:#FFF1F1;--danL:#A2191F;--danI:#750E13}@media (prefers-color-scheme: dark){#db2u-deploy{--bg:#161616;--panel:#262626;--line:#393939;--ink:#F4F4F4;--muted:#C6C6C6;--faint:#8D8D8D;--grid:#1F1F1F;--priF:#001141;--priL:#78A9FF;--priI:#A6C8FF;--secF:#081A1C;--secL:#08BDBA;--secI:#3DDBD9;--neuF:#262626;--neuL:#6F6F6F;--neuI:#C6C6C6;--cauF:#1C1500;--cauL:#D2A106;--cauI:#FDDC69;--danF:#2D0709;--danL:#FA4D56;--danI:#FFB3B8}}#db2u-deploy text{font-family:var(--sans)}#db2u-deploy .ttl{font-size:20px;font-weight:600;fill:var(--ink);letter-spacing:-0.01em}#db2u-deploy .sub{font-size:13px;fill:var(--muted)}#db2u-deploy .fig{font-family:var(--mono);font-size:11px;font-weight:500;fill:var(--faint);letter-spacing:0.08em}#db2u-deploy .eye{font-size:10.5px;font-weight:600;letter-spacing:0.06em;font-family:var(--mono)}#db2u-deploy .h{font-size:14px;font-weight:600;fill:var(--ink)}#db2u-deploy .hm{font-family:var(--mono);font-size:13px;font-weight:600;fill:var(--ink)}#db2u-deploy .gh{font-size:13px;font-weight:600;fill:var(--ink)}#db2u-deploy .b{font-size:12.5px;fill:var(--ink)}#db2u-deploy .m{font-family:var(--mono);font-size:11px;fill:var(--muted)}#db2u-deploy .mv{font-family:var(--mono);font-size:12px;font-weight:500;fill:var(--ink)}#db2u-deploy .lab{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}#db2u-deploy .labd{font-family:var(--mono);font-size:10.5px;font-weight:500;fill:var(--danI)}#db2u-deploy .hd{font-family:var(--mono);font-size:10.5px;font-weight:500;fill:var(--faint);letter-spacing:0.08em}</style><defs><marker id="db2u-deploy-m-neu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-deploy-m-pri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:var(--priL)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-deploy-m-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:var(--secL)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-deploy-m-cau" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:var(--cauL)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-deploy-m-dan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:var(--danL)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><pattern id="db2u-deploy-pat" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" style="fill:var(--grid)"/></pattern></defs><rect width="1200" height="304" rx="10" style="fill:var(--bg)"/><rect width="1200" height="304" rx="10" fill="url(#db2u-deploy-pat)"/><text x="40" y="52" class="ttl">Deploy order</text><text x="40" y="76" class="sub">Five steps, in order. docs/end-to-end.md has the commands and a check for each.</text><text x="1160" y="52" class="fig" text-anchor="end">FIG 2</text><g><rect x="40" y="104" width="212" height="148" rx="4" style="fill:var(--panel);stroke:var(--neuL)" stroke-width="1"/><rect x="56" y="119" width="7" height="7" style="fill:var(--neuL)"/><text x="70" y="126" class="eye" style="fill:var(--neuI)">01 · STORAGE</text><text x="56" y="150" class="h">Object storage</text><text x="56" y="172" class="b">Bucket, policy, user</text><text x="56" y="191" class="b">Access key, endpoint CA</text><text x="56" y="210" class="m">object-storage-setup.md</text></g><path d="M254 146H266" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-deploy-m-neu)"/><text x="146" y="278" class="m" text-anchor="middle">storage console</text><g><rect x="268" y="104" width="212" height="148" rx="4" style="fill:var(--panel);stroke:var(--secL)" stroke-width="1"/><rect x="284" y="119" width="7" height="7" style="fill:var(--secL)"/><text x="298" y="126" class="eye" style="fill:var(--secI)">02 · DB2</text><text x="284" y="150" class="h">Operator and instance</text><text x="284" y="172" class="b">OperatorGroup targets</text><text x="284" y="191" class="b">namespace-scope ConfigMap</text><text x="284" y="210" class="b">Node environment labels</text><text x="284" y="229" class="m">db2u-instance/</text></g><path d="M482 146H494" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-deploy-m-neu)"/><text x="374" y="278" class="m" text-anchor="middle">oc · cluster-admin</text><g><rect x="496" y="104" width="212" height="148" rx="4" style="fill:var(--panel);stroke:var(--priL)" stroke-width="1"/><rect x="512" y="119" width="7" height="7" style="fill:var(--priL)"/><text x="526" y="126" class="eye" style="fill:var(--priI)">03 · FUSION</text><text x="512" y="150" class="h">Backup &amp; Restore</text><text x="512" y="172" class="b">Velero plugin on the DPA</text><text x="512" y="191" class="b">Location, policy, recipes</text><text x="512" y="210" class="b">Transform, assignment</text><text x="512" y="229" class="m">ibm-backup-restore/</text></g><path d="M710 146H722" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-deploy-m-neu)"/><text x="602" y="278" class="m" text-anchor="middle">oc · ibm-spectrum-fusion-ns</text><g><rect x="724" y="104" width="212" height="148" rx="4" style="fill:var(--panel);stroke:var(--priL)" stroke-width="1"/><rect x="740" y="119" width="7" height="7" style="fill:var(--priL)"/><text x="754" y="126" class="eye" style="fill:var(--priI)">04 · HELPER</text><text x="740" y="150" class="h">Recipe helper</text><text x="740" y="172" class="b">Project, service account</text><text x="740" y="191" class="b">ClusterRole and binding</text><text x="740" y="210" class="b">UBI deployment with curl</text><text x="740" y="229" class="m">recipe-helper/</text></g><path d="M938 146H950" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-deploy-m-neu)"/><text x="830" y="278" class="m" text-anchor="middle">oc · every cluster</text><g><rect x="952" y="104" width="212" height="148" rx="4" style="fill:var(--panel);stroke:var(--neuL)" stroke-width="1"/><rect x="968" y="119" width="7" height="7" style="fill:var(--neuL)"/><text x="982" y="126" class="eye" style="fill:var(--neuI)">05 · OPERATIONS</text><text x="968" y="150" class="h">Back up and restore</text><text x="968" y="172" class="b">Backup from UI or CR</text><text x="968" y="191" class="b">Restore maps helper ns</text><text x="968" y="210" class="b">Check enterprise license</text><text x="968" y="229" class="m">operations/*.yaml</text></g><text x="1058" y="278" class="m" text-anchor="middle">Fusion UI or oc</text></svg>
