<svg xmlns="http://www.w3.org/2000/svg" id="db2u-layouts" viewBox="0 0 1200 612" width="1200" height="612" role="img" aria-labelledby="db2u-layouts-t db2u-layouts-d"><title id="db2u-layouts-t">Namespace layouts</title><desc id="db2u-layouts-d">Namespace layouts: IBM's sample puts the Db2u operator and the instance in one namespace, so a backup carries both. The production layout gives the operator its own GitOps-managed namespace and each instance its own namespace and backup scope.</desc><style>#db2u-layouts{--sans:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;--mono:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;--bg:#F4F4F4;--panel:#FFFFFF;--line:#E0E0E0;--ink:#161616;--muted:#525252;--faint:#8D8D8D;--grid:#E8E8E8;--priF:#EDF5FF;--priL:#0F62FE;--priI:#0043CE;--secF:#D9FBFB;--secL:#007D79;--secI:#005D5D;--neuF:#F4F4F4;--neuL:#A8A8A8;--neuI:#525252;--cauF:#FCF4D6;--cauL:#B28600;--cauI:#684E00;--danF:#FFF1F1;--danL:#A2191F;--danI:#750E13}@media (prefers-color-scheme: dark){#db2u-layouts{--bg:#161616;--panel:#262626;--line:#393939;--ink:#F4F4F4;--muted:#C6C6C6;--faint:#8D8D8D;--grid:#1F1F1F;--priF:#001141;--priL:#78A9FF;--priI:#A6C8FF;--secF:#081A1C;--secL:#08BDBA;--secI:#3DDBD9;--neuF:#262626;--neuL:#6F6F6F;--neuI:#C6C6C6;--cauF:#1C1500;--cauL:#D2A106;--cauI:#FDDC69;--danF:#2D0709;--danL:#FA4D56;--danI:#FFB3B8}}#db2u-layouts text{font-family:var(--sans)}#db2u-layouts .ttl{font-size:20px;font-weight:600;fill:var(--ink);letter-spacing:-0.01em}#db2u-layouts .sub{font-size:13px;fill:var(--muted)}#db2u-layouts .fig{font-family:var(--mono);font-size:11px;font-weight:500;fill:var(--faint);letter-spacing:0.08em}#db2u-layouts .eye{font-size:10.5px;font-weight:600;letter-spacing:0.06em;font-family:var(--mono)}#db2u-layouts .h{font-size:14px;font-weight:600;fill:var(--ink)}#db2u-layouts .hm{font-family:var(--mono);font-size:13px;font-weight:600;fill:var(--ink)}#db2u-layouts .gh{font-size:13px;font-weight:600;fill:var(--ink)}#db2u-layouts .b{font-size:12.5px;fill:var(--ink)}#db2u-layouts .m{font-family:var(--mono);font-size:11px;fill:var(--muted)}#db2u-layouts .mv{font-family:var(--mono);font-size:12px;font-weight:500;fill:var(--ink)}#db2u-layouts .lab{font-family:var(--mono);font-size:10.5px;fill:var(--muted)}#db2u-layouts .labd{font-family:var(--mono);font-size:10.5px;font-weight:500;fill:var(--danI)}#db2u-layouts .hd{font-family:var(--mono);font-size:10.5px;font-weight:500;fill:var(--faint);letter-spacing:0.08em}</style><defs><marker id="db2u-layouts-m-neu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-layouts-m-pri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:var(--priL)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-layouts-m-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:var(--secL)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-layouts-m-cau" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:var(--cauL)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-layouts-m-dan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:var(--danL)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><pattern id="db2u-layouts-pat" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" style="fill:var(--grid)"/></pattern></defs><rect width="1200" height="612" rx="10" style="fill:var(--bg)"/><rect width="1200" height="612" rx="10" fill="url(#db2u-layouts-pat)"/><text x="40" y="52" class="ttl">Namespace layouts</text><text x="40" y="76" class="sub">IBM's sample keeps the operator with the instance. Production clusters give the operator its own namespace.</text><text x="1160" y="52" class="fig" text-anchor="end">FIG 2</text><rect x="40" y="104" width="540" height="468" rx="8" style="fill:none;stroke:var(--faint)" stroke-width="1" stroke-dasharray="5 4"/><text x="60" y="134" class="gh">IBM sample layout</text><text x="560" y="134" class="m" text-anchor="end">one namespace</text><g><rect x="64" y="152" width="492" height="240" rx="4" style="fill:var(--panel);stroke:var(--cauL)" stroke-width="1"/><rect x="80" y="167" width="7" height="7" style="fill:var(--cauL)"/><text x="94" y="174" class="eye" style="fill:var(--cauI)">NAMESPACE · BACKUP SCOPE</text><text x="80" y="198" class="h">Shared namespace</text></g><rect x="88" y="216" width="444" height="64" rx="0" style="fill:var(--panel);stroke:var(--line)" stroke-width="1"/><text x="102" y="243" class="h">Db2u operator</text><text x="102" y="262" class="m">Subscription · OperatorGroup · CSV · manager pod</text><rect x="88" y="312" width="444" height="64" rx="0" style="fill:var(--panel);stroke:var(--line)" stroke-width="1"/><text x="102" y="339" class="h">Db2uInstance</text><text x="102" y="358" class="m">volumes · configmaps · secrets</text><path d="M310 282V308" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-layouts-m-neu)"/><rect x="316.0" y="287" width="76.0" height="17" rx="3" style="fill:var(--panel)"/><text x="322" y="299" class="lab" text-anchor="start">reconciles</text><text x="64" y="428" class="gh">Trade-offs of sharing a namespace</text><rect x="64" y="450" width="6" height="6" style="fill:var(--cauL)"/><text x="80" y="458" class="b">Project access spans the operator and the database</text><rect x="64" y="476" width="6" height="6" style="fill:var(--cauL)"/><text x="80" y="484" class="b">Backups carry operator and OLM objects</text><rect x="64" y="502" width="6" height="6" style="fill:var(--cauL)"/><text x="80" y="510" class="b">Deleting the project removes both</text><rect x="64" y="528" width="6" height="6" style="fill:var(--cauL)"/><text x="80" y="536" class="b">Restores only into the same namespace</text><rect x="620" y="104" width="540" height="468" rx="8" style="fill:none;stroke:var(--faint)" stroke-width="1" stroke-dasharray="5 4"/><text x="640" y="134" class="gh">Production layout</text><text x="1140" y="134" class="m" text-anchor="end">namespace per instance</text><g><rect x="644" y="152" width="492" height="100" rx="4" style="fill:var(--panel);stroke:var(--neuL)" stroke-width="1"/><rect x="660" y="167" width="7" height="7" style="fill:var(--neuL)"/><text x="674" y="174" class="eye" style="fill:var(--neuI)">NAMESPACE · NOT BACKED UP</text><text x="660" y="198" class="h">db2-operator</text><text x="660" y="220" class="m">Db2u operator · managed by GitOps</text></g><g><rect x="644" y="300" width="236" height="92" rx="4" style="fill:var(--panel);stroke:var(--secL)" stroke-width="1"/><rect x="660" y="315" width="7" height="7" style="fill:var(--secL)"/><text x="674" y="322" class="eye" style="fill:var(--secI)">NAMESPACE · BACKUP SCOPE</text><text x="660" y="346" class="h">Instance A</text><text x="660" y="368" class="m">Db2uInstance + volumes</text></g><g><rect x="900" y="300" width="236" height="92" rx="4" style="fill:var(--panel);stroke:var(--secL)" stroke-width="1"/><rect x="916" y="315" width="7" height="7" style="fill:var(--secL)"/><text x="930" y="322" class="eye" style="fill:var(--secI)">NAMESPACE · BACKUP SCOPE</text><text x="916" y="346" class="h">Instance B</text><text x="916" y="368" class="m">Db2uInstance + volumes</text></g><path d="M890 254V276H762V296" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-layouts-m-neu)"/><path d="M890 276H1018V296" fill="none" style="stroke:var(--muted)" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-layouts-m-neu)"/><rect x="896.0" y="258" width="76.0" height="17" rx="3" style="fill:var(--bg)"/><text x="902" y="270" class="lab" text-anchor="start">reconciles</text><text x="644" y="428" class="gh">Benefits of separate namespaces</text><rect x="644" y="450" width="6" height="6" style="fill:var(--secL)"/><text x="660" y="458" class="b">Access scoped to each instance</text><rect x="644" y="476" width="6" height="6" style="fill:var(--secL)"/><text x="660" y="484" class="b">Operator rebuilt from GitOps, not restored</text><rect x="644" y="502" width="6" height="6" style="fill:var(--secL)"/><text x="660" y="510" class="b">Fusion backs up only the database</text><rect x="644" y="528" width="6" height="6" style="fill:var(--secL)"/><text x="660" y="536" class="b">Restore into another namespace</text></svg>
