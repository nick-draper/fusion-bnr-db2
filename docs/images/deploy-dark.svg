<svg xmlns="http://www.w3.org/2000/svg" id="db2u-deploy-dark" viewBox="0 0 1200 304" width="1200" height="304" role="img" aria-labelledby="db2u-deploy-dark-t db2u-deploy-dark-d"><title id="db2u-deploy-dark-t">Deploy order</title><desc id="db2u-deploy-dark-d">Deploy order: object storage, Db2 operator and instance, Fusion Backup and Restore, recipe helper, then back up and restore. Each step lists where it runs.</desc><style>#db2u-deploy-dark text{font-family:'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif}#db2u-deploy-dark .ttl{font-size:20px;font-weight:600;fill:#F4F4F4;letter-spacing:-0.01em}#db2u-deploy-dark .sub{font-size:13px;fill:#C6C6C6}#db2u-deploy-dark .fig{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;font-weight:500;fill:#8D8D8D;letter-spacing:0.08em}#db2u-deploy-dark .eye{font-size:10.5px;font-weight:600;letter-spacing:0.06em;font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}#db2u-deploy-dark .h{font-size:14px;font-weight:600;fill:#F4F4F4}#db2u-deploy-dark .hm{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:13px;font-weight:600;fill:#F4F4F4}#db2u-deploy-dark .gh{font-size:13px;font-weight:600;fill:#F4F4F4}#db2u-deploy-dark .b{font-size:12.5px;fill:#F4F4F4}#db2u-deploy-dark .m{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:11px;fill:#C6C6C6}#db2u-deploy-dark .mv{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12px;font-weight:500;fill:#F4F4F4}#db2u-deploy-dark .lab{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10.5px;fill:#C6C6C6}#db2u-deploy-dark .labd{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10.5px;font-weight:500;fill:#FFB3B8}#db2u-deploy-dark .hd{font-family:'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:10.5px;font-weight:500;fill:#8D8D8D;letter-spacing:0.08em}</style><defs><marker id="db2u-deploy-dark-m-neu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#C6C6C6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-deploy-dark-m-pri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#78A9FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-deploy-dark-m-sec" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#08BDBA" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-deploy-dark-m-cau" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#D2A106" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="db2u-deploy-dark-m-dan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M1.5 1.5L9 5L1.5 8.5" fill="none" style="stroke:#FA4D56" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><pattern id="db2u-deploy-dark-pat" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1" style="fill:#1F1F1F"/></pattern></defs><rect width="1200" height="304" rx="10" style="fill:#161616"/><rect width="1200" height="304" rx="10" fill="url(#db2u-deploy-dark-pat)"/><text x="40" y="52" class="ttl">Deploy order</text><text x="40" y="76" class="sub">Five steps, in order. docs/end-to-end.md has the commands and a check for each.</text><text x="1160" y="52" class="fig" text-anchor="end">FIG 2</text><g><rect x="40" y="104" width="212" height="148" rx="4" style="fill:#262626;stroke:#6F6F6F" stroke-width="1"/><rect x="56" y="119" width="7" height="7" style="fill:#6F6F6F"/><text x="70" y="126" class="eye" style="fill:#C6C6C6">01 · STORAGE</text><text x="56" y="150" class="h">Object storage</text><text x="56" y="172" class="b">Bucket, policy, user</text><text x="56" y="191" class="b">Access key, endpoint CA</text><text x="56" y="210" class="m">object-storage-setup.md</text></g><path d="M254 146H266" fill="none" style="stroke:#C6C6C6" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-deploy-dark-m-neu)"/><text x="146" y="278" class="m" text-anchor="middle">storage console</text><g><rect x="268" y="104" width="212" height="148" rx="4" style="fill:#262626;stroke:#08BDBA" stroke-width="1"/><rect x="284" y="119" width="7" height="7" style="fill:#08BDBA"/><text x="298" y="126" class="eye" style="fill:#3DDBD9">02 · DB2</text><text x="284" y="150" class="h">Operator and instance</text><text x="284" y="172" class="b">OperatorGroup targets</text><text x="284" y="191" class="b">namespace-scope ConfigMap</text><text x="284" y="210" class="b">Node environment labels</text><text x="284" y="229" class="m">db2u-instance/</text></g><path d="M482 146H494" fill="none" style="stroke:#C6C6C6" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-deploy-dark-m-neu)"/><text x="374" y="278" class="m" text-anchor="middle">oc · cluster-admin</text><g><rect x="496" y="104" width="212" height="148" rx="4" style="fill:#262626;stroke:#78A9FF" stroke-width="1"/><rect x="512" y="119" width="7" height="7" style="fill:#78A9FF"/><text x="526" y="126" class="eye" style="fill:#A6C8FF">03 · FUSION</text><text x="512" y="150" class="h">Backup &amp; Restore</text><text x="512" y="172" class="b">Velero plugin on the DPA</text><text x="512" y="191" class="b">Location, policy, recipes</text><text x="512" y="210" class="b">Transform, assignment</text><text x="512" y="229" class="m">ibm-backup-restore/</text></g><path d="M710 146H722" fill="none" style="stroke:#C6C6C6" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-deploy-dark-m-neu)"/><text x="602" y="278" class="m" text-anchor="middle">oc · ibm-spectrum-fusion-ns</text><g><rect x="724" y="104" width="212" height="148" rx="4" style="fill:#262626;stroke:#78A9FF" stroke-width="1"/><rect x="740" y="119" width="7" height="7" style="fill:#78A9FF"/><text x="754" y="126" class="eye" style="fill:#A6C8FF">04 · HELPER</text><text x="740" y="150" class="h">Recipe helper</text><text x="740" y="172" class="b">Project, service account</text><text x="740" y="191" class="b">ClusterRole and binding</text><text x="740" y="210" class="b">UBI deployment with curl</text><text x="740" y="229" class="m">recipe-helper/</text></g><path d="M938 146H950" fill="none" style="stroke:#C6C6C6" stroke-width="1.25" stroke-linejoin="round" marker-end="url(#db2u-deploy-dark-m-neu)"/><text x="830" y="278" class="m" text-anchor="middle">oc · every cluster</text><g><rect x="952" y="104" width="212" height="148" rx="4" style="fill:#262626;stroke:#6F6F6F" stroke-width="1"/><rect x="968" y="119" width="7" height="7" style="fill:#6F6F6F"/><text x="982" y="126" class="eye" style="fill:#C6C6C6">05 · OPERATIONS</text><text x="968" y="150" class="h">Back up and restore</text><text x="968" y="172" class="b">Backup from UI or CR</text><text x="968" y="191" class="b">Restore maps helper ns</text><text x="968" y="210" class="b">Check enterprise license</text><text x="968" y="229" class="m">operations/*.yaml</text></g><text x="1058" y="278" class="m" text-anchor="middle">Fusion UI or oc</text></svg>
