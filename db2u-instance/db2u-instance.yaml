---
apiVersion: db2u.databases.ibm.com/v1
kind: Db2uInstance
metadata:
  name: dwdb # Name of the actual DB
  namespace: db2u-instance
  labels:
    my.cluster/environment: prod
    for-backup: 'true'
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
            - key: my.cluster/environment
              operator: In
              values: 
                - prod
            - key: scale.spectrum.ibm.com/role
              operator: NotIn 
              values:
                - afm
  account:
    securityConfig:
      privilegedSysctlInit: true
  addOns:
    opendataformats:
      workloadProfile: default
  advOpts:
    timezone: Australia/Melbourne
  environment:
    authentication:
      ldap:
        enabled: true
    databases:
      - name: DWDB01
        settings:
          dftTableOrg: 'ROW'
    dbType: db2wh
    instance:
      dbmConfig:
        AUTHENTICATION: SERVER
    partitionConfig:
      dataOnMln0: true
      total: 1
      volumePerPartition: true
  license:
    accept: true
    value: <Insert License>
  nodes: 1
  podTemplate:
    db2u:
      resource:
        db2u:
          limits:
            cpu: '4'
            memory: 16Gi
  storage:
    - name: meta
      spec:
        accessModes:
          - ReadWriteMany
        resources:
          requests:
            storage: 5Gi
        storageClassName: isf-block-file-delete-sc
      type: create
    - name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: isf-block-file-delete-sc
      type: template
    - name: tempts
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: isf-block-file-delete-sc
      type: template
  version: s12.1.4.0
...
